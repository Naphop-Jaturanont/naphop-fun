</style></head><body><div class="wrap"><nav><a href="../" class="brand">naphop.fun →</a><div><button id="calm" aria-pressed="false"></button><button id="lang">EN</button><button id="reset"></button></div></nav><main><header class="intro"><div><div class="eyebrow">A SMALL MESSAGE. AN ENORMOUS WAIT.</div><h1>Cosmic <em>Reply.</em></h1></div><p id="intro"></p></header><div class="journey" id="destinations"></div><section class="workbench"><div class="space"><div class="space-top"><span id="route"></span><span id="rate"></span></div><svg viewBox="0 0 650 300" role="img" aria-labelledby="sceneTitle sceneDesc"><title id="sceneTitle">Signal journey</title><desc id="sceneDesc">A schematic signal travels from Earth to its destination and back.</desc><defs><radialGradient id="earth"><stop stop-color="#75b2ab"/><stop offset=".75" stop-color="#38777c"/><stop offset="1" stop-color="#24505f"/></radialGradient><radialGradient id="body"><stop stop-color="#eacb98"/><stop offset="1" stop-color="#a15b40"/></radialGradient></defs><g fill="#adc5c5" opacity=".55"><circle cx="70" cy="55" r="1.5"/><circle cx="210" cy="40" r="1"/><circle cx="320" cy="77" r="2"/><circle cx="420" cy="31" r="1"/><circle cx="610" cy="60" r="2"/><circle cx="280" cy="250" r="1.5"/><circle cx="450" cy="256" r="1"/><circle cx="60" cy="230" r="2"/><circle cx="590" cy="244" r="1"/></g><path d="M125 135H525" stroke="#78958e" stroke-width="1" stroke-dasharray="3 8"/><path d="M525 180H125" stroke="#78958e" stroke-width="1" stroke-dasharray="3 8"/><path id="trail" d="M125 135H125" fill="none" stroke="#e2f59c" stroke-width="3"/><circle cx="100" cy="157" r="51" fill="url(#earth)"/><path d="M69 120l24 6 2 19 26 12-8 25-18 17-7-32-23-17z" fill="#aed1a0" opacity=".65"/><circle id="planet" cx="550" cy="157" r="40" fill="url(#body)"/><g id="craters" fill="#754d3f" opacity=".3"><circle cx="536" cy="144" r="10"/><circle cx="560" cy="176" r="7"/><circle cx="567" cy="141" r="4"/></g><g id="packet" class="signal" transform="translat // MODEL-BEGIN
const C_KM_S=299792.458,MOON_KM=384400;const MODES={moon:{oneWay:MOON_KM/C_KM_S},near:{oneWay:180},far:{oneWay:1320}};
function createModel(){return {mode:'moon',oneWay:MODES.moon.oneWay,time:0,phase:'idle',prediction:null,speed:1,discoveries:[],lang:'th',calm:false}}
function chooseMode(s,mode){if(!Object.hasOwn(MODES,mode))return false;s.mode=mode;s.oneWay=MODES[mode].oneWay;restart(s);return true}
function restart(s){s.time=0;s.phase='idle';s.prediction=null}
function setDelay(s,min){if(s.mode==='moon'||!Number.isFinite(min)||min<3||min>22)return false;s.oneWay=min*60;restart(s);return true}
function start(s,prediction){if(s.phase!=='idle'||!Number.isFinite(prediction)||prediction<0)return false;s.prediction=prediction;s.time=0;s.phase='out';return true}
function advance(s,seconds){if(!['out','back'].includes(s.phase)||!Number.isFinite(seconds)||seconds<0)return false;s.time=Math.min(2*s.oneWay,s.time+seconds);s.phase=s.time>=2*s.oneWay?'done':s.time>=s.oneWay?'back':'out';if(s.phase==='done'){const key=s.mode==='moon'?'moon':s.oneWay<=600?'near':'far';if(!s.discoveries.includes(key))s.discoveries.push(key)}return true}
function nextEvent(s){if(s.phase==='out')return advance(s,s.oneWay-s.time);if(s.phase==='back')return advance(s,2*s.oneWay-s.time);return false}
function position(s){return s.phase==='out'?{x:125+400*s.time/s.oneWay,y:135}:s.phase==='back'?{x:525-400*(s.time-s.oneWay)/s.oneWay,y:180}:s.phase==='done'?{x:125,y:180}:{x:125,y:135}}
// MODEL-END
const state=createModel(),$=id=>document.getElementById(id),t=(th,en)=>state.lang==='th'?th:en;state.calm=matchMedia('(prefers-reduced-motion: reduce)').matches;let selected=null,last=0;
function timeText(sec){if(sec<60)return sec.toFixed(2)+t(' วินาที',' s');const rounded=Math.round(sec);return Math.floor(rounded/60)+t(' นาที',' min')+(rounded%60?' '+rounded%60+t(' วินาที',' s'):'')}
function phaseText(){return ({idle:t('พร้อมส่งสัญญาณ','Ready to transmit'),out:t('ข้อความกำลังเดินทางออกจากโลก','Your message is leaving Earth'),back:t('ได้รับแล้ว! คำตอบกำลังเดินทางกลับ','Received! The reply is coming back'),done:t('คำตอบมาถึงโลกแล้ว','Reply received on Earth')})[state.phase]}
function feedback(){if(state.phase==='idle')return t('เลือกคำตอบที่คิดว่าใช่ แล้วกดส่ง “สวัสดี”','Make a prediction, then send “Hello”.');if(state.phase==='out')return t('ยังไม่มีใครอ่านข้อความได้ สัญญาณยังไปไม่ถึง','Nobody there can read your message yet. The signal has not arrived.');if(state.phase==='back')return t('ปลายทางอ่านแล้ว แต่คุณยังไม่รู้! ต้องรอคำตอบเดินทางกลับอีกหนึ่งเที่ยว','They have read it. But you cannot know yet! The reply needs another journey.');const right=Math.abs(state.prediction-2*state.oneWay)<.05;return (right?t('ทายถูก! ','Correct! '):t('เฉลย: ','The answer: '))+timeText(2*state.oneWay)+t(' อย่างน้อย แม้ตอบกลับทันที เพราะต้องเดินทางทั้งไปและกลับ',' minimum, even with an instant reply. The signal must travel both ways.')}
function draw(){const p=position(state);$('packet').setAttribute('transform',`translate(${state.calm?(state.phase==='out'?125:state.phase==='back'?525:125):p.x} ${p.y})`);$('packet').style.opacity=state.phase==='idle'?.45:1;$('trail').setAttribute('d',state.calm?'M125 135H525':state.phase==='out'?`M125 135H${p.x}`:state.phase==='back'?`M525 180H${p.x}`:'M125 180H125');$('elapsed').textContent=timeText(state.time);$('phase').textContent=phaseText();$('message').textContent=state.phase==='out'?t('สวัสดี →','HELLO →'):state.phase==='back'?t('← ได้ยินแล้ว!','← HEARD YOU!'):state.phase==='done'?t('การสนทนาเพิ่งเริ่มได้','NOW THE CONVERSATION CAN BEGIN'):t('ข้อความหนึ่งคำต้องเดินทางไกลแค่ไหน?','HOW FAR MUST ONE WORD TRAVEL?')}

TIME');$('distanceLabel').textContent=moon?t('ระยะเฉลี่ยที่ใช้','MEAN DISTANCE USED'):t('ระยะคำนวณจากเวลาที่เลือก','DISTANCE DERIVED FROM SELECTED DELAY');$('distance').textContent=(moon?MOON_KM:Math.round(state.oneWay*C_KM_S)).toLocaleString('en-US')+' km';$('oneWayLabel').textContent=t('เวลาเดินทางขาเดียว','ONE-WAY LIGHT TIME');$('oneWay').textContent=timeText(state.oneWay);$('step').textContent=t('ทาย → ส่ง → ค้นพบ','PREDICT → SEND → DISCOVER');$('question').textContent=t('คำตอบจะกลับมาถึงเร็วที่สุดใน…','The earliest reply arrives in…');$('context').textContent=t('สมมติปลายทางตอบกลับทันที ไม่มีเวลาอ่าน พิมพ์ หรือรอคิว','Assume an instant reply: no reading, typing or waiting in a queue.');const options=[state.oneWay/10,state.oneWay,state.oneWay*2];$('choices').innerHTML=options.map((n,i)=>`<button data-choice="${i}" aria-pressed="${selected===i}" ${state.phase!=='idle'?'disabled':''}>${timeText(n)}</button>`).join('');$('send').textContent=state.phase==='done'?t('ลองส่งอีกครั้ง →','Send again →'):t('ส่ง “สวัสดี” →','Send “Hello” →');$('send').disabled=['out','back'].includes(state.phase)||(state.phase==='idle'&&selected===null);$('speed').textContent=state.speed===1?t('เร่งเวลา 120×','Fast-forward 120×'):t('ใช้เวลาจริง 1×','Real time 1×');$('skip').textContent=state.phase==='back'?t('ข้ามไปตอนคำตอบถึง →','Jump to reply →'):t('ข้ามไปตอนข้อความถึง →','Jump to delivery →');$('skip').disabled=!['out','back'].includes(state.phase);$('status').textContent=feedback();$('lab').classList.toggle('hidden',moon);$('delay').value=state.oneWay/60;$('delay').disabled=['out','back'].includes(state.phase);$('delayLabel').textContent=t('ทดลองระยะอื่น: เลือกเวลาเดินทางขาเดียว','Try another distance: choose a one-way delay');$('modelNote').textContent=t('Moon ใช้ระยะเฉลี่ย ไม่ใช่ตำแหน่งวันนี้ • Mars ใช้ช่วงประมาณ 3–22 นาทีจาก NASA เป็นค่าทดลอง ไม่ใช่ขอบเขตตายตัว เวลาเล่นเร่งได้ แต่สัญญาณในแบบจำลองยังเดินทางที่ c','Moon uses a mean distance, not today’s position. Mars uses NASA’s approximate 3–22 min range as example delays, not exact limits. Playback can accelerate; the modeled signal still travels at c.');$('receipts').innerHTML=[['moon',t('ระยะใกล้ก็ไม่ทันที','NEAR IS NOT INSTANT'),timeText(2*MODES.moon.oneWay),t('ดวงจันทร์: เวลาขั้นต่ำของการถาม–ตอบ จากระยะเฉลี่ย','Moon: minimum question-and-reply time using the mean distance.')],['near',t('อ่านแล้ว ≠ รู้ว่าอ่าน','READ ≠ KNOWN TO BE READ'),'2 × '+t('ขาเดียว','ONE WAY'),t('คุณจะรู้ว่าอีกฝ่ายได้รับข้อความ ก็ต่อเมื่อคำยืนยันเดินทางกลับมาถึง','You learn that the message arrived only when its acknowledgement returns.')],['far',t('คุยสดไม่ได้เสมอไป','A LIVE CHAT HAS LIMITS'),'44 '+t('นาที','min'),t('เมื่อขาเดียวใช้ 22 นาที คำตอบแรกต้องรออย่างน้อย 44 นาที แม้ไม่มีใครเสียเวลาพิมพ์','At a 22-minute one-way delay, even an instant reply takes 44 minutes.')]].map(([key,label,big,body])=>`<article class="receipt ${state.discoveries.includes(key)?'unlocked':''}"><span>${state.discoveries.includes(key)?'✓ ':''}${label}</span><b>${state.discoveries.includes(key)?big:'···'}</b><p>${state.discoveries.includes(key)?body:t('ส่งข้อความให้ครบเที่ยวเพื่อเปิดการค้นพบนี้','Complete a round trip to reveal this discovery.')}</p></article>`).join('');$('sourcesTitle').textContent=t('นี่คือวิทยาศาสตร์ส่วนไหน และสมมติอะไรไว้?','What is real, and what is simplified?');$('sourcesText').innerHTML=t('<p>สัญญาณวิทยุในสุญญากาศเดินทางด้วยความเร็วแสง c = 299,792.458 km/s ระยะทาง ÷ c คือเวลาเที่ยวเดียว และคูณ 2 คือเวลาขั้นต่ำของการถาม–ตอบ ในนี้ปลายทางหยุดนิ่งและตอบทันที ไม่มีเวลาประมวลผล การส่งข้อมูล การจัดคิว หรือรีเลย์ ของจริงอาจใช้เวลานานกว่า ภาพไม่ได้ตามสัดส่วน การเร่งเวลาและปุ่มข้ามเปลี่ยนแค่การแสดงผล ไม่ได้ทำให้สัญญาณเร็วกว่าแสง</p>','<p>Radio signals in vacuum travel at c = 299,792.458 km/s. Distance ÷ c gives one-way time; twice that gives the minimum question-and-reply time. Destinations are held still and reply instantly here. Processing, transmission duration, queues and relays are omitted; real conversations can take longer. The picture is not to scale. Fast-forward and jump affect playback, not the signal’s physical speed.</p>')+'<ul><li><a href="https://www.nist.gov/si-redefinition/meet-constants">NIST · speed of light: 299,792,458 m/s</a></li><li><a href="https://spaceplace.nasa.gov/moon-distance/en/">NASA · mean Earth–Moon distance: 384,400 km</a></li><li><a href="https://science.nasa.gov/blog/speaking-percys-language-how-to-talk-so-perseverance-will-listen/">NASA/JPL · radio communication to Mars: about 3–22 min one way</a></li></ul><p>'+t('ตรวจแหล่งข้อมูล 3 พ.ย. 2026 · ไม่ใช่ข้อมูลวงโคจรสด','Sources checked 3 Nov 2026 · Not live orbital data')+'</p>';$('footer').textContent=t('ไม่มีบัญชี · ไม่มีการติดตาม · สร้างเพื่อความอยากรู้','No accounts · No tracking · Built for curiosity');draw();if(focusSelector){const replacement=document.querySelector(focusSelector);if(replacement&&!replacement.disabled)replacement.focus()}}
$('destinations').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){chooseMode(state,b.dataset.mode);selected=null;render()}};$('choices').onclick=e=>{const b=e.target.closest('[data-choice]');if(b&&state.phase==='idle'){selected=Number(b.dataset.choice);render()}};$('send').onclick=()=>{if(state.phase==='done'){restart(state);selected=null}else if(selected!==null)start(state,[state.oneWay/10,state.oneWay,state.oneWay*2][selected]);render()};$('speed').onclick=()=>{state.speed=state.speed===1?120:1;render()};$('skip').onclick=()=>{nextEvent(state);render()};$('delay').oninput=e=>{setDelay(state,Number(e.target.value));selected=null;render()};$('lang').onclick=()=>{state.lang=state.lang==='th'?'en':'th';render()};$('calm').onclick=()=>{state.calm=!state.calm;render()};$('reset').onclick=()=>{const lang=state.lang,calm=state.calm;Object.assign(state,createModel(),{lang,calm});selected=null;render()};document.addEventListener('visibilitychange',()=>{last=0});function frame(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(!document.hidden){const before=state.phase;advance(state,dt*state.speed);if(before!==state.phase)render();else if(['out','back'].includes(state.phase))draw()}requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
