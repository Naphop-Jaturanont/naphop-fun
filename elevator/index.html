here…',resetDone:'Back at the beginning',taken:'A borrowed bubble! Bring it to something that is still asleep.',bloom:'The garden wakes! Your bubble becomes a luminous flower.',washed:'Out rolls a freshly washed moon. Bring it back to the lobby.',unlock:'A perfect fit! A new ∞ button lights up.',finish:'You took a whole universe home. In one small pocket.',needBubble:'The garden needs a breath. Try the library on floor 1.',needFlower:'The machine needs living light. Try the garden on floor 2.',needMoon:'The frame is empty. A moon might be in the wash on floor 3.',doneRoom:'This room remembers you. Try carrying your wonder to another floor.',hangMoon:'Hang the moon in the frame',openInfinite:'Visit floor ∞ →',gardenGrown:'The leaves remember their colours, and still wave hello. A flower from this garden might power the moon-washing machine.',laundryDone:'The moon is so clean it reflects home. Bring it to the round frame in the lobby.',lobbyOpen:'The wall opens into the sky. A button that was never there appears on the panel. Press ∞ to discover where this lift came from.',allDone:'Nothing more to collect. Watch the stars for a while, or begin a new journey whenever you like.',already:'Already collected',hint:['Start on floor 1. Can something in your pocket help another room?','A bubble carries a breath. The garden on floor 2 is asleep.','A flower carries light. Try the laundromat on floor 3.','Take the moon back to its frame on floor 0.','The ∞ button is awake. Try it.','Your destination is in your pocket. Take a star to finish the trip.','All discoveries found. Invite someone else into this elevator.']}};
const icon={none:'·',bubble:'◯',flower:'✿',moon:'☾',star:'✦'};function W(){return words[lang]}function announce(k){$('status').textContent=W()[k]||''}function stopTimers(){generation++;timers.forEach(clearTimeout);timers=[]}function later(fn,ms){const g=generation;timers.push(setTimeout(()=>{if(g===generation)fn()},ms))}
