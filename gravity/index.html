'use strict';const $=id=>document.getElementById(id);let lang='th',calm=matchMedia('(prefers-reduced-motion: reduce)').matches;const types=['cup','book','plant','ball'],target={cup:'left',book:'right',plant:'up',ball:'down'},dirs={up:[0,-1],left:[-1,0],down:[0,1],right:[1,0]};const fresh=()=>({dir:'down',selected:'cup',found:new Set(),zero:false,items:types.map((id,i)=>({id,x:150+i*140,y:430,vx:0,vy:0}))});let s=fresh(),last=0,raf=0;const w={th:{title:'ห้องที่ทำแรงโน้มถ่วงหาย',intro:'เลือกของหนึ่งชิ้น เปลี่ยนทิศแรงโน้มถ่วง แล้วพามันไปยังที่ที่คาดไม่ถึง ทุกชิ้นมีความลับของตัวเอง',pick:'1 · เลือกสิ่งที่อยากค้นพบ',tilt:'2 · เปลี่ยนแรงโน้มถ่วง',names:['ถ้วยกาแฟ','หนังสือ','ต้นไม้','ลูกบอล'],dir:['ขึ้น','ซ้าย','ลง','ขวา'],transform:'ลองปลุกความลับ',zero:'ปิดแรงโน้มถ่วง · ต้องพบ 4 อย่าง',zeroReady:'ปิดแรงโน้มถ่วง →',zeroDone:'จักรวาลอยู่ในห้องนี้แล้ว',motion:'ลดการเคลื่อนไหว',reset:'เริ่มใหม่',room:'ROOM 003 / NOTHING IS QUITE ORDINARY',footer:'เรื่องแต่งเล็ก ๆ · ไม่ใช่แบบจำลองวิทยาศาสตร์',found:'สิ่งที่ค้นพบ',hint:{cup:'กาแฟอยากไหลออกไปนอกขอบโลก ลองพาถ้วยไปผนังซ้าย',book:'หนังสืออยากบินออกหน้าต่าง ลองพามันไปผนังขวา',plant:'ต้นไม้อยากเป็นโคมไฟ ลองให้มันหยั่งรากบนเพดาน',ball:'ลูกบอลอยากเป็นดวงจันทร์ ลองพามันลงไปยังวงกลมที่พื้น'},wait:'รอให้ของชิ้นนี้ไปถึงขอบห้องก่อน แล้วลองปลุกความลับ',wrong:'ยังไม่ใช่มุมที่มันฝันถึง ลองทิศที่คำใบ้บอก',already:'พบความลับชิ้นนี้แล้ว ลองเลือกของชิ้นอื่น',start:'ลองเริ่มจากถ้วยกาแฟ เลือกทิศซ้าย แล้วรอดูมันเคลื่อนที่',reveals:{cup:'กาแฟหก... กลายเป็นทางช้างเผือกบนผนัง!',book:'หน้าหนังสือคลี่เป็นปีก เรื่องราวบินได้แล้ว',plant:'รากกลายเป็นสายไฟ ผลไม้กลายเป็นดวงดาว',ball:'ลูกบอลตกลงในวงกลม และจำได้ว่าตัวเองเคยเป็นดวงจันทร์'},finish:'เมื่อไม่มีอะไรต้องตกลงมา ห้องธรรมดาก็กลายเป็นจักรวาลที่พกกลับบ้านได้',resetDone:'ทุกอย่างกลับมาธรรมดาอีกครั้ง ลองค้นพบใหม่ได้เลย',all:'ครบทั้ง 4 อย่างแล้ว ลองปิดแรงโน้มถ่วงดู',settled:'ถึงขอบห้องแล้ว ลองปลุกความลับได้',active:'กำลังลอยไปตามแรงโน้มถ่วง'},en:{title:'Gravity Lost & Found',intro:'Pick an ordinary object. Turn gravity. Take it somewhere unexpected. Everything here has a secret.',pick:'1 · CHOOSE SOMETHING ORDINARY',tilt:'2 · TURN GRAVITY',names:['Coffee cup','Book','Plant','Ball'],dir:['Up','Left','Down','Right'],transform:'Wake its secret',zero:'Zero gravity · Find all 4 first',zeroReady:'Switch gravity off →',zeroDone:'A universe, in one room',motion:'Calm motion',reset:'Reset',room:'ROOM 003 / NOTHING IS QUITE ORDINARY',footer:'A tiny fiction · Not a science simulation',found:'DISCOVERIES',hint:{cup:'Coffee wants to spill over the edge of the world. Try the left wall.',book:'This book dreams of flying through the window. Try the right wall.',plant:'The plant wants to be a lamp. Let it take root on the ceiling.',ball:'The ball wants to be a moon. Take it to the circle on the floor.'},wait:'Let this object reach the edge first, then wake its secret.',wrong:'Not the corner it dreams of. Try the direction in the clue.',already:'You found this secret. Choose another ordinary thing.',start:'Start with the coffee cup. Choose left, then watch it move.',reveals:{cup:'Spilled coffee... becomes a galaxy on the wall.',book:'The pages unfold into wings. Stories can fly now.',plant:'Roots become wires. Fruit becomes little stars.',ball:'The ball falls into a circle and remembers it used to be a moon.'},finish:'With nothing left to fall, an ordinary room becomes a universe you can take home.',resetDone:'Everything is ordinary again. Discover it all another way.',all:'All four found. What happens if you switch gravity off?',settled:'At the edge. Try waking its secret.',active:'Following gravity'}};const W=()=>w[lang];function say(k){$('status').textContent=W()[k]||k}function selected(){return s.items.find(o=>o.id===s.selected)}function edge(o,d=s.dir){return d==='left'?o.x<=75:d==='right'?o.x>=645:d==='up'?o.y<=85:o.y>=515}function choose(id){if(!types.includes(id)||s.zero)return false;s.selected=id;renderUI();draw();return true}function turn(d){if(!Object.hasOwn(dirs,d)||s.zero)return false;s.dir=d;for(const o of s.items)if(o.id===s.selected&&!s.found.has(o.id)){o.vx=0;o.vy=0;if(calm){if(d==='left')o.x=70;if(d==='right')o.x=650;if(d==='up')o.y=80;if(d==='down')o.y=520}}renderUI();draw();return true}function reveal(){if(s.zero)return false;let id=s.selected;if(s.found.has(id)){say('already');return false}if(s.dir!==target[id]){say('wrong');return false}if(!edge(selected())){say('wait');return false}s.found.add(id);renderUI();draw();$('status').textContent=W().reveals[id]+(s.found.size===4?' '+W().all:'');return true}function zero(){if(s.found.size!==4||s.zero)return false;s.zero=true;renderUI();draw();say('finish');return true}function reset(){s=fresh();last=0;renderUI();draw();say('resetDone')}function step(dt){if(!Number.isFinite(dt)||dt<=0||s.zero||calm)return;dt=Math.min(dt,.04);const [gx,gy]=dirs[s.dir];for(const o of s.items){if(s.found.has(o.id)||o.id!==s.selected)continue;o.vx=(o.vx+gx*480*dt)*.994;o.vy=(o.vy+gy*480*dt)*.994;o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<70){o.x=70;o.vx=Math.abs(o.vx)*.25}if(o.x>650){o.x=650;o.vx=-Math.abs(o.vx)*.25}if(o.y<80){o.y=80;o.vy=Math.abs(o.vy)*.25}if(o.y>520){o.y=520;o.vy=-Math.abs(o.vy)*.25}}}function frame(t){if(!document.hidden&&!calm&&!s.zero){step(last?(t-last)/1000:0);draw()}last=t;raf=requestAnimationFrame(frame)}
const stars=(n=30)=>Array.from({length:n},(_,i)=>`<circle class="twinkle" cx="${40+(i*127)%640}" cy="${45+(i*83)%500}" r="${1+i%3}" fill="#f6d9a4" style="animation-delay:${i%5}s"/>`).join('');function art(id){if(id==='cup')return '<path d="M-27-25h48v43q-22 23-48 0z" fill="#e49b73"/><path d="M22-16q38-9 28 22q-8 17-28 8" fill="none" stroke="#e49b73" stroke-width="10"/><ellipse cx="-3" cy="-25" rx="24" ry="8" fill="#634d40"/><path d="M-16-45q-8-9 0-17m18 17q8-9 0-17" stroke="#e4d2b3" stroke-width="3" fill="none"/>';if(id==='book')return '<path d="M-35-29q20-12 35 0q19-12 35 0v61q-17-10-35 0q-17-10-35 0z" fill="#f8e6b7" stroke="#b97451" stroke-width="6"/><path d="M0-26v55m-26-42h17m-17 12h17m18-12h17m-17 12h17" stroke="#ac9b79" stroke-width="2"/>';if(id==='plant')return '<path d="M-25 5h50l-7 35h-36z" fill="#bc7655"/><path d="M0 5v-55m0 32q-45-8-32-36q35-4 32 36m0-13q38-8 28-35q-32-3-28 35" fill="#73977a" stroke="#597c68" stroke-width="5"/>';return '<circle r="29" fill="#edc66f"/><path d="M-27-5q27 22 53-6M-10-28q-2 28 21 53" fill="none" stroke="#bd9252" stroke-width="5"/>'}
function draw(){let bg=s.zero?`<rect width="720" height="600" fill="#20334b"/>${stars(45)}<circle cx="360" cy="300" r="215" fill="#799d9a"/><circle cx="360" cy="300" r="190" fill="#e0c69b"/><path d="M180 300q180-120 360 0q-180 150-360 0" fill="#748e6f"/><ellipse cx="360" cy="300" rx="305" ry="85" transform="rotate(-22 360 300)" fill="none" stroke="#e8cca1" stroke-width="13"/>`:`<rect width="720" height="600" fill="#ddd1b9"/><rect width="720" height="600" fill="url(#grid)"/><path d="M30 30H690V570H30Z" fill="none" stroke="#ae9f83" stroke-width="14"/><path d="M555 150h100v150H555z" fill="#a1bdbe" stroke="#7c9187" stroke-width="10"/><path d="M605 150v150m-50-75h100" stroke="#d7d4ba" stroke-width="7"/><circle cx="360" cy="540" r="38" fill="#9aaca6" stroke="#e9dec7" stroke-width="7"/><path d="M90 45h100m-100 8h100" stroke="#a6a891" stroke-width="4"/><path d="M50 280q32-18 0-36m0 72q32-18 0-36" fill="none" stroke="#b89e7b" stroke-width="3"/>`;$('background').innerHTML=bg;let z='';if(s.found.has('cup'))z+=`<g transform="translate(${s.zero?240:100} ${s.zero?280:320})"><ellipse rx="75" ry="37" fill="#3b485b" transform="rotate(-25)"/><ellipse rx="56" ry="21" fill="none" stroke="#e8bd83" stroke-width="5" transform="rotate(-25)"/><ellipse rx="32" ry="13" fill="#db9a71" transform="rotate(-25)"/><circle r="9" fill="#fff0bf"/></g>`;if(s.found.has('book'))z+=`<g transform="translate(${s.zero?460:590} ${s.zero?190:220})"><path d="M0 0q-90-100-105-20q20 55 105 20q90-100 105-20q-20 55-105 20" fill="#f1dfb0" stroke="#b99668" stroke-width="4"/><path d="M-10 0l10 24L10 0M-70-25l50 20m90-20-50 20" stroke="#927e61" stroke-width="3" fill="none"/></g>`;if(s.found.has('plant'))z+=`<g transform="translate(${s.zero?350:250} ${s.zero?250:70})"><path d="M0 0q-75 60-90 140M0 0q80 50 90 140M0 0v180" stroke="#567b6a" stroke-width="9" fill="none"/>${[[-90,140],[90,140],[0,180]].map(([x,y])=>`<path d="M${x} ${y-26}l8 18 20 2-15 13 4 20-17-10-17 10 4-20-15-13 20-2z" fill="#f9d479"/>`).join('')}</g>`;if(s.found.has('ball'))z+=`<g transform="translate(${s.zero?470:360} ${s.zero?370:510})"><circle r="39" fill="#f7dea0"/><circle cx="15" cy="-12" r="34" fill="${s.zero?'#799d9a':'#ddd1b9'}"/></g>`;if(s.zero)z+=`<path d="M270 430q90 40 180 0l-25 65H295z" fill="#be805f"/><path d="M275 444q85 24 170 0" fill="none" stroke="#edbb8a" stroke-width="8"/>`;$('wonders').innerHTML=z;$('objects').innerHTML=s.zero?'':s.items.filter(o=>!s.found.has(o.id)).map(o=>`<g transform="translate(${o.x.toFixed(2)} ${o.y.toFixed(2)})">${o.id===s.selected?'<circle r="47" fill="none" stroke="#c65c3e" stroke-width="3" stroke-dasharray="5 5"/>':''}${art(o.id)}</g>`).join('')}
function renderUI(){const a=W();document.documentElement.lang=lang;document.body.classList.toggle('calm',calm);$('title').textContent=a.title;$('intro').textContent=a.intro;$('pickLabel').textContent=a.pick;$('tiltLabel').textContent=a.tilt;$('motion').textContent=a.motion;$('motion').setAttribute('aria-pressed',String(calm));$('language').textContent=lang==='th'?'EN':'ไทย';$('reset').textContent=a.reset;$('roomLabel').textContent=a.room;$('sceneTitle').textContent=s.zero?a.finish:a.title;$('footer').textContent=a.footer;$('hint').textContent=s.zero?a.finish:s.found.size===4?a.all:s.found.has(s.selected)?a.already:a.hint[s.selected];$('transform').textContent=a.transform;$('transform').setAttribute('aria-disabled',String(s.zero||s.found.has(s.selected)));$('zero').textContent=s.zero?a.zeroDone:s.found.size===4?a.zeroReady:a.zero;$('zero').setAttribute('aria-disabled',String(s.found.size!==4||s.zero));$('foundLabel').textContent=a.found+' · '+s.found.size+'/4';$('discoveries').innerHTML=types.map((id,i)=>`<span class="stamp ${s.found.has(id)?'found':''}" aria-label="${a.names[i]}: ${s.found.has(id)?'✓':'—'}">${s.found.has(id)?['✧','⌁','✦','☾'][i]:i+1}</span>`).join('');document.querySelectorAll('[data-object]').forEach((b,i)=>{b.textContent=(s.found.has(types[i])?'✓ ':'')+a.names[i];b.setAttribute('aria-pressed',String(types[i]===s.selected));b.setAttribute('aria-disabled',String(s.zero))});document.querySelectorAll('[data-dir]').forEach((b,i)=>{b.setAttribute('aria-label',a.dir[['up','left','down','right'].indexOf(b.dataset.dir)]);b.setAttribute('aria-pressed',String(s.dir===b.dataset.dir));b.setAttribute('aria-disabled',String(s.zero))})}
document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>choose(b.dataset.object));document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(b.dataset.dir));$('transform').onclick=reveal;$('zero').onclick=zero;$('reset').onclick=reset;$('language').onclick=()=>{lang=lang==='th'?'en':'th';renderUI();say(s.zero?'finish':'')};$('motion').onclick=()=>{calm=!calm;if(calm)turn(s.dir);renderUI();draw()};document.addEventListener('visibilitychange',()=>{last=0});renderUI();draw();say('start');raf=requestAnimationFrame(frame);
