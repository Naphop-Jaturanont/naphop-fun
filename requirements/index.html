<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Requirement Detective — naphop.fun</title><style>
:root{--ink:#233b31;--paper:#fff7e7;--orange:#fb835c;--lime:#d9ed7a}*{box-sizing:border-box}body{margin:0;background:#f4eddc;color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #5e67ca;outline-offset:4px}.app{max-width:1060px;margin:auto;padding:26px 30px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cfd4c2;padding-bottom:18px}.home{text-decoration:none;font-size:22px;font-weight:900;letter-spacing:-1px}.controls{display:flex;gap:8px}.btn{border:1px solid #c3cdbb;border-radius:100px;padding:10px 17px;background:transparent;color:var(--ink);font-weight:bold}.btn.primary{background:var(--ink);border-color:var(--ink);color:white}.heading{text-align:center;padding:35px 0 24px}.eyebrow{font:11px monospace;letter-spacing:2px;color:#65775e}.heading h1{font-size:clamp(32px,5vw,52px);letter-spacing:-1.5px;margin:13px 0}.heading p{font-size:17px;line-height:1.7;color:#64735d;max-width:620px;margin:auto}.case{background:var(--paper);border:1px solid #d0d4c1;border-radius:20px;overflow:hidden;box-shadow:0 16px 0 #284b3210}.case-top{display:flex;justify-content:space-between;align-items:center;padding:18px 27px;background:var(--orange);font:12px monospace;letter-spacing:1px}.statement{padding:37px 42px 30px;font-size:clamp(23px,3.2vw,33px);line-height:1.65;min-height:160px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 28px 27px}.choice{border:2px solid #bcc9ac;background:#fff9eb;border-radius:14px;padding:20px;text-align:left;font-weight:bold;font-size:18px;color:var(--ink)}.choice span{display:block;font-size:13px;font-weight:normal;line-height:1.6;margin-top:7px;color:#65775e}.choice:hover:not(:disabled){background:#edf2d7;transform:translateY(-2px)}.choice.correct{background:var(--lime);border-color:#58754e}.choice.wrong{background:#f9d6c4;border-color:#c26640}.choice:disabled{cursor:default}.explanation{margin:0 28px 27px;padding:20px 23px;border-radius:12px;background:#eaf0d8;line-height:1.8;font-size:16px}.explanation.waiting{background:#f2eddd;color:#6e7966}.explanation strong{display:block;margin-bottom:5px}.example{display:block;border-top:1px dashed #a9ba98;margin-top:12px;padding-top:12px;font-size:14px}.bottom{display:flex;justify-content:space-between;align-items:center;margin:26px 0;gap:20px}.dots{display:flex;gap:8px}.dot{width:14px;height:14px;background:#ced5c2;border-radius:50%}.dot.active{outline:2px solid var(--ink);outline-offset:3px}.dot.yes{background:#587b3b}.dot.no{background:var(--orange)}.score{font-size:14px;color:#64735d;margin-top:12px}.end{text-align:center;padding:45px 25px}.end h2{font-size:38px;margin:0 0 18px}.big-score{font-size:76px;font-family:Arial;font-weight:900;color:var(--ink)}.end p{max-width:640px;margin:18px auto 26px;line-height:1.8;font-size:18px}.end-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.end-actions a{display:inline-block;text-decoration:none}.note{font-size:12px;color:#6c7863;line-height:1.7;padding-top:20px;border-top:1px solid #cfd4c2;margin-top:30px}.note a{color:inherit}.btn:disabled{opacity:.4;cursor:default}@media(max-width:600px){.app{padding:18px}.home{font-size:20px}.heading{padding:28px 0 20px}.heading h1{font-size:34px}.heading p{font-size:16px}.statement{padding:25px;font-size:23px}.choices{grid-template-columns:1fr;padding:0 20px 20px;gap:10px}.choice{padding:16px}.explanation{margin:0 20px 20px;padding:17px}.case-top{padding:16px 20px;font-size:10px}.bottom{gap:10px}.dot{width:11px;height:11px}.btn{padding:10px 13px}.end h2{font-size:29px}.big-score{font-size:60px}.end p{font-size:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="app"><header><a href="../" class="home">← naphop.fun</a><div class="controls"><button class="btn" id="lang" aria-label="Switch language">EN</button><button class="btn" id="sound" aria-pressed="false">♪ OFF</button></div></header><main><div class="heading"><div class="eyebrow">CASE FILE / REQUIREMENTS</div><h1>Requirement Detective</h1><p id="intro"></p></div><div id="game"></div></main><footer class="note" id="note"></footer></div><script>
let lang='th',sound=false,i=0,selected=null,score=0,history=[],ctx;const t=(a,b)=>lang==='th'?a:b;const data=[
{th:'“ระบบต้องเร็วมาก”',en:'“The system must be very fast.”',ok:false,why:['เร็วแค่ไหน? งานอะไร? ภายใต้โหลดเท่าไร? ยังตัดสินผ่าน–ไม่ผ่านไม่ได้','How fast? Which operation? Under what load? You cannot yet decide pass or fail.'],fix:['ถามต่อ: ต้องการวัดเวลาตอบของงานไหน และผู้ใช้พร้อมกันเท่าไร?','Ask: which operation’s response time matters, and at what concurrent load?']},
{th:'“เมื่อเลือกรายการ 2 แก้ว ราคาแก้วละ 60 บาท ระบบต้องแสดงยอดรวม 120 บาท”',en:'“For two drinks at 60 baht each, the system must display a total of 120 baht.”',ok:true,why:['มี Input และผลที่คาดหวังชัดเจน จึงทำ Test case ได้','The input and expected output are explicit, so you can write a test case.'],fix:['นี่คือกรณีตัวอย่างหนึ่ง ไม่ได้ครอบคลุมกติกาคำนวณทั้งหมด เช่น ส่วนลดหรือภาษี','This is one example case, not coverage of every pricing rule such as discounts or tax.']},
{th:'“หน้าจอต้องสวยและใช้ง่ายสำหรับทุกคน”',en:'“The interface must be beautiful and easy for everyone.”',ok:false,why:['คำว่าสวยและง่ายขึ้นกับผู้ใช้ ต้องกำหนดกลุ่มเป้าหมาย งานที่จะทำ และเกณฑ์ตรวจสอบ','Beauty and ease depend on the audience. Define target users, their tasks and measurable criteria.'],fix:['ถามต่อ: ผู้ใช้กลุ่มไหนต้องทำงานอะไรสำเร็จ และจะประเมินอย่างไร?','Ask: which user group must complete which task, and how will it be evaluated?']},
{th:'“quantity ต้องเป็น Integer ตั้งแต่ 1 ขึ้นไป ระบบต้องปฏิเสธค่า 0 และ 1.5”',en:'“quantity must be an Integer of at least 1. The system must reject 0 and 1.5.”',ok:true,why:['ระบุชนิดข้อมูล ขอบเขต และตัวอย่างค่าที่ใช้ไม่ได้อย่างชัดเจน','The type, boundary and example invalid values are explicit.'],fix:['ทดสอบขอบเขตเพิ่ม เช่น 1 และค่ามากที่ระบบรองรับ รวมถึงรูปแบบข้อความแจ้งข้อผิดพลาด','Add boundary tests such as 1 and supported large values, plus the agreed error-message behavior.']},
{th:'“ถ้าจ่ายเงินมีปัญหา ระบบต้องจัดการให้เหมาะสม”',en:'“If payment has a problem, the system must handle it appropriately.”',ok:false,why:['ปัญหาแบบไหน? ล้มเหลวแน่นอนหรือยังไม่ทราบผล? และใครต้องทำอะไรต่อ?','Which problem? A confirmed failure or an unknown outcome? Who should do what next?'],fix:['ถามต่อ: ถ้าเน็ตหลุดหลังส่งคำขอ ระบบตรวจสถานะและป้องกันการจ่ายซ้ำอย่างไร? ต้องตกลงกับทีมเทคนิค','Ask: after a connection drop, how should status be checked and duplicate charging prevented? Agree this with engineers.']},
{th:'“สำหรับออร์เดอร์ที่มี sweetness = no_sugar ทั้งหน้าจอ Cashier และ Barista ต้องแสดงข้อความ No sugar”',en:'“For an order with sweetness = no_sugar, both Cashier and Barista screens must display No sugar.”',ok:true,why:['ข้อมูลต้นทางและผลที่ต้องตรงกันบนสองหน้าจอระบุไว้ชัด','The source value and the matching output on both screens are specified.'],fix:['เชื่อม Requirement นี้กับกรณีทดสอบสองหน้าจอ และยืนยันคำที่ผู้ใช้เข้าใจตรงกัน','Link the requirement to a two-screen test and confirm the wording with users.']},
{th:'“ระบบต้องปลอดภัย 100%”',en:'“The system must be 100% secure.”',ok:false,why:['เป็นคำรับประกันที่ตรวจสอบอย่างครอบคลุมไม่ได้ ต้องระบุความเสี่ยงและมาตรการที่เหมาะกับระบบ','This is not a comprehensively verifiable guarantee. Identify relevant risks and specific controls.'],fix:['ถามต่อ: ข้อมูลใดต้องปกป้อง ใครเข้าถึงได้ และใช้เกณฑ์ทดสอบใด?','Ask: what data needs protection, who may access it and which checks will verify the controls?']},
{th:'“ในชุดทดสอบ T1 ที่กำหนดไว้ 95% ของคำขอดูเมนูต้องตอบภายใน 2 วินาที ที่ผู้ใช้พร้อมกัน 100 คน”',en:'“In the defined T1 test setup, 95% of menu requests must respond within 2 seconds with 100 concurrent users.”',ok:true,why:['มีงานที่วัด ตัวเลข โหลด และสภาพแวดล้อมอ้างอิง จึงทดสอบเทียบเกณฑ์ได้','It names the operation, threshold, load and reference environment, enabling a repeatable check.'],fix:['T1 ต้องมีรายละเอียดจริง และตัวเลขต้องผ่านการตกลงพร้อมตรวจความเป็นไปได้ ไม่ใช่ตั้งเองโดย SA','T1 needs an actual definition. Stakeholders must agree the target and engineers check feasibility; the SA should not invent it alone.']}
];function bi(a){return a[lang==='th'?0:1]}function tone(ok){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?740:280;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.17);o.start();o.stop(ctx.currentTime+.2)}catch(e){sound=false}}
function render(){document.documentElement.lang=lang;document.getElementById('lang').textContent=lang==='th'?'EN':'ไทย';document.getElementById('sound').textContent='♪ '+(sound?'ON':'OFF');document.getElementById('sound').setAttribute('aria-pressed',sound);document.getElementById('intro').textContent=t('ตรวจบรีฟ 8 ใบ ข้อนี้ทดสอบผ่าน–ไม่ผ่านได้แล้ว หรือยังต้องถามเพิ่ม?','Inspect eight briefs. Can this requirement be tested, or does it need clarification?');document.getElementById('note').innerHTML=t('สถานการณ์สมมติเพื่อเรียนรู้ · Testable ไม่ได้แปลว่าครบถ้วนหรือเหมาะสมเสมอ · ไม่มีการเก็บคะแนนส่วนตัว','Teaching examples · Testable does not automatically mean complete or appropriate · No personal score tracking')+' · <a href="https://www.nasa.gov/reference/appendix-c-how-to-write-a-good-requirement/" target="_blank" rel="noopener">NASA: Writing good requirements</a>';if(i>=data.length){document.getElementById('game').innerHTML=`<section class="case end"><div class="eyebrow">CASE CLOSED</div><h2>${t('จับคำคลุมเครือได้แล้ว','You found the missing detail.')}</h2><div class="big-score">${score}<span style="font-size:25px;opacity:.5"> / 8</span></div><p>${t('Requirement ที่ดีไม่ได้แค่ฟังดูดี แต่ต้องรู้ว่าจะตรวจอย่างไร และยังต้องยืนยันความถูกต้อง คุณค่า และความเป็นไปได้กับผู้เกี่ยวข้อง','A useful requirement is more than good wording: you need to know how to verify it, then validate its correctness, value and feasibility with stakeholders.')}</p><div class="end-actions"><button class="btn primary" onclick="restart()">${t('เล่นอีกครั้ง','Play again')}</button><a class="btn" href="../sa-cafe/">${t('ต่อยอดใน SA Studio →','Explore SA Studio →')}</a></div></section>`;return}const d=data[i];document.getElementById('game').innerHTML=`<section class="case"><div class="case-top"><span>BRIEF ${String(i+1).padStart(2,'0')} / 08</span><span>${selected===null?'AWAITING REVIEW':'EVIDENCE REVIEWED'}</span></div><div class="statement">${lang==='th'?d.th:d.en}</div><div class="choices">${[true,false].map((v,j)=>`<button class="choice ${selected!==null?(v===d.ok?'correct':selected===v?'wrong':''):''}" ${selected!==null?'disabled':''} onclick="answer(${v})">${j===0?t('ทดสอบได้','Testable'):t('ต้องถามเพิ่ม','Needs clarification')}<span>${j===0?t('มีข้อมูลพอสำหรับเกณฑ์ผ่าน–ไม่ผ่านที่กล่าวไว้','Enough information for the stated pass/fail check'):t('ยังมีคำคลุมเครือหรือเงื่อนไขสำคัญไม่ครบ','Vague language or important conditions are missing')}</span></button>`).join('')}</div><div class="explanation ${selected===null?'waiting':''}" aria-live="polite">${selected===null?t('ไม่ต้องรีบ ลองคิดว่าจะพิสูจน์ข้อความนี้อย่างไร','Take your time. How would you prove or disprove the statement?'):`<strong>${selected===d.ok?t('ตรวจได้ตรงจุด!','Good investigation!'):t('ลองดูหลักฐานอีกครั้ง','Look at the evidence again.')}</strong>${bi(d.why)}<span class="example">${bi(d.fix)}</span>`}</div></section><div class="bottom"><div><div class="dots">${data.map((_,n)=>`<span class="dot ${n===i?'active':''} ${n<history.length?(history[n]?'yes':'no'):''}" aria-label="${n<history.length?(history[n]?'Correct':'Review'):'Not answered'}"></span>`).join('')}</div><div class="score">${t('ตรวจถูก','Correct')} ${score} / 8</div></div><button class="btn primary" ${selected===null?'disabled':''} onclick="next()">${i===7?t('ปิดคดี →','Close the case →'):t('ใบถัดไป →','Next brief →')}</button></div>`}
function answer(v){if(selected!==null)return;selected=v;const ok=v===data[i].ok;history.push(ok);if(ok)score++;tone(ok);render()}function next(){if(selected===null)return;i++;selected=null;render();window.scrollTo(0,0)}function restart(){i=0;selected=null;score=0;history=[];render()}document.getElementById('lang').onclick=()=>{lang=lang==='th'?'en':'th';render()};document.getElementById('sound').onclick=()=>{sound=!sound;tone(true);render()};render();
</script></body></html>
