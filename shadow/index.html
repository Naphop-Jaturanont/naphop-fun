ottom:7px}.secret.found{background:#e7def2;color:#553b70;border-color:#c4aed9}.foot{text-align:center;color:#8c8091;font-size:12px;padding:0 20px 25px;line-height:1.8}.bubble{font-family:Arial,sans-serif;font-size:24px;fill:#756080}#sleepMarks{font-size:28px;fill:#806a94}.star{fill:#f5ead6}.night{transition:opacity .4s}.blink{transform-origin:center}.help{max-width:650px;text-align:center;margin:10px auto;font-size:14px;color:#76627c;line-height:1.7;padding:0 20px}.hidden{display:none}.moon{pointer-events:none}@media(max-width:600px){header{padding:16px;flex-wrap:wrap;gap:12px}header a{font-size:17px}.head-actions{margin-left:auto}.head-actions{gap:5px}button{padding:9px 12px}.intro{padding-top:5px}h1{letter-spacing:-1px}.intro p{font-size:15px}.theatre{padding:0}.status{font-size:17px;min-height:60px}.controls{gap:10px 20px;margin-bottom:15px}.slider{font-size:12px;gap:6px}input[type=range]{width:110px}.secrets{grid-template-columns:repeat(3,1fr)}.journal{padding-top:15px}.eyebrow{font-size:10px}.foot{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><a href="../">← naphop.fun</a><div class="head-actions"><button id="motion" aria-pressed="false"></button><button id="language">EN</button><button id="reset"></button></div></header><main><div class="intro"><div class="eyebrow">EXPERIMENT 003 · LIGHT / A LITTLE DISOBEDIENCE</div><h1 id="title"></h1><p id="subtitle"></p></div><div class="theatre"><svg id="stage" viewBox="0 0 1000 510" role="img" aria-labelledby="sceneTitle sceneDesc"><title id="sceneTitle">A person and a shadow with a mind of its own</title><desc id="sceneDesc">Move the sun with the sliders below or drag it. The shadow reacts to movement, rest, low light and an eclipse.</desc><defs><radialGradient id="halo"><stop stop-color="#ffe5a0" stop-opacity=".8"/><stop offset="1" stop-color="#ffe5a0" stop-opacity="0"/></radialGradient><linearGradient id="ground" x2="0" y2="1"><stop stop-color="#e5d5cd"/><stop offset="1" stop-color="#f7f2e7"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="3"/></filter></defs><rect x="12" y="15" width="976" height="470" rx="35" fill="#ece2df"/><rect class="night" id="nightSky" x="12" y="15" width="976" height="470" rx="35" fill="#262039" opacity="0"/><g id="stars" opacity="0"><circle class="star" cx="120" cy="110" r="2"/><circle class="star" cx="840" cy="90" r="3"/><circle class="star" cx="700" cy="160" r="2"/><circle class="star" cx="280" cy="80" r="3"/><circle class="star" cx="570" cy="60" r="2"/><path d="M785 190v14m-7-7h14" stroke="#f5ead6" stroke-width="2"/></g><path d="M12 365Q500 325 988 365V450Q988 485 953 485H47Q12 485 12 450Z" fill="url(#ground)"/><path d="M70 365Q500 330 930 365" fill="none" stroke="#c7b8bf" stroke-width="1"/><ellipse cx="500" cy="387" rx="51" ry="9" fill="#5f4b6c" opacity=".12"/>
<g id="shadow" transform="translate(500 380)"><path id="shadowBody" d="M-12 0Q-28-65-18-112Q0-137 18-112Q28-65 12 0Z" fill="#574568"/><circle id="shadowHead" cy="-137" r="27" fill="#574568"/><path id="shadowArm" d="M-15-98Q-55-75-69-101M15-98Q55-75 69-101" fill="none" stroke="#574568" stroke-width="14" stroke-linecap="round"/><g id="eyes" fill="#f1e3f3"><ellipse cx="-9" cy="-141" rx="4" ry="5"/><ellipse cx="9" cy="-141" rx="4" ry="5"/></g><path id="smile" d="M-7-127Q0-121 7-127" stroke="#f1e3f3" fill="none" stroke-width="2"/></g>
<g id="person"><path d="M484 378L488 322M516 378L512 322" stroke="#c66e53" stroke-width="15" stroke-linecap="round"/><path d="M479 291Q500 276 521 291L522 338H478Z" fill="#e2ad55"/><path d="M479 296L464 327M521 296L536 327" stroke="#e2ad55" stroke-width="12" stroke-linecap="round"/><circle cx="500" cy="264" r="23" fill="#d68d70"/><path d="M477 264Q469 229 502 235Q524 233 525 260Q503 245 477 264" fill="#382d39"/><circle cx="493" cy="265" r="2" fill="#382d39"/><circle cx="507" cy="265" r="2" fill="#382d39"/><path d="M496 276Q500 279 504 276" stroke="#8e4b46" fill="none" stroke-width="2"/></g>
<g id="sleepMarks" opacity="0"><text x="650" y="310">z</text><text x="675" y="288" font-size="22">z</text><text x="697" y="267" font-size="16">z</text></g><g id="sun" class="sun" transform="translate(250 110)"><circle r="95" fill="url(#halo)"/><circle r="32" fill="#f2bc4d"/><circle r="23" fill="#ffdc7c"/><path d="M-45 0h-8M45 0h8M0-45v-8M0 45v8M32 32l6 6M-32-32l-6-6M32-32l6-6M-32 32l-6 6" stroke="#e2ad55" stroke-width="3" stroke-linecap="round"/></g><g id="moon" class="moon"><circle cx="750" cy="95" r="33" fill="#a499b5"/><circle cx="739" cy="88" r="5" fill="#8b7e9d"/><circle cx="761" cy="104" r="7" fill="#8b7e9d"/><circle cx="758" cy="80" r="3" fill="#8b7e9d"/></g><text id="moonHint" x="750" y="148" text-anchor="middle" font-size="12" fill="#8d7b99">?</text></svg></div><div id="status" class="status" role="status" aria-live="polite"></div><div class="controls"><label class="slider"><span id="xLabel"></span><input id="sunX" type="range" min="80" max="920" value="250" step="5"></label><label class="slider"><span id="yLabel"></span><input id="sunY" type="range" min="65" max="300" value="110" step="5"></label><button id="wave"></button><button class="hint" id="hint"></button></div><div class="help hidden" id="help"></div><section class="journal"><div class="journal-head"><span id="journalTitle"></span><span id="count">0 / 6</span></div><div class="secrets" id="secrets"></div></section><div class="foot" id="foot"></div></main><script>
'use strict';
const $=id=>document.getElementById(id), media=matchMedia('(prefers-reduced-motion: reduce)');let lang='th',calm=media.matches;
const defs=[['lag','↝','ตามไม่ทัน','Running late'],['sleep','☾','แอบงีบ','A little nap'],['wake','☀','ตื่นแล้ว!','Wide awake'],['wave','✋','ทักกลับ','Hello there'],['stretch','↔','ยืดเส้น','A long stretch'],['eclipse','✦','อิสระในความมืด','Free in the dark']];
let s,prev=performance.now(),drag=false;const tr=(a,b)=>lang==='th'?a:b;
function init(){s={x:250,y:110,angle:50,velocity:0,idle:0,mode:'follow',wave:0,awake:0,found:new Set(),moves:0};drag=false;$('sunX').value=250;$('sunY').value=110;$('help').classList.add('hidden');clock=0;renderText();draw(0)}
function discover(id){if(!s.found.has(id)){s.found.add(id);renderJournal()}}
function renderJournal(){$('count').textContent=`${s.found.size} / 6`;$('secrets').innerHTML=defs.map(([id,icon,th,en])=>`<div class="secret ${s.found.has(id)?'found':''}"><b>${s.found.has(id)?icon:'·'}</b>${s.found.has(id)?tr(th,en):tr('ยังไม่พบ','Undiscovered')}</div>`).join('')}
function renderText(){document.documentElement.lang=lang;$('language').textContent=lang==='th'?'EN':'ไทย';$('title').textContent=tr('เงาที่ไม่เชื่อฟัง','The Unruly Shadow');$('subtitle').textContent=tr('ลากดวงอาทิตย์ แล้วดูว่าเงาจะยอมตามคุณแค่ไหน','Drag the sun. See how much your shadow agrees.');$('reset').textContent=tr('เริ่มใหม่','Reset');$('motion').textContent=calm?tr('เคลื่อนไหวน้อย','Calm motion'):tr('เคลื่อนไหวเต็ม','Full motion');$('motion').setAttribute('aria-pressed',String(calm));$('xLabel').textContent=tr('ซ้าย ↔ ขวา','Left ↔ right');$('yLabel').textContent=tr('สูง ↔ ต่ำ','High ↔ low');$('wave').textContent=tr('โบกมือให้เงา ✋','Wave hello ✋');$('hint').textContent=tr('ขอคำใบ้','A little hint');$('journalTitle').textContent=tr('นิสัยเล็ก ๆ ที่คุณค้นพบ','Little things you discovered');$('help').textContent=tr('ลองย้ายแสงเร็ว ๆ · วางนิ่ง 5 วินาที · ขยับให้ตื่น · โบกมือ · ลดแสงลงต่ำ · พาดวงอาทิตย์ไปทับดวงจันทร์','Move the light quickly · rest for 5 seconds · wake it up · wave · lower the sun · cover the moon with the sun');$('foot').textContent=tr('งานทดลองเชิงจินตนาการ ไม่ใช่แบบจำลองฟิสิกส์ · ใช้ปุ่มลูกศรบนแถบเลื่อนแทนการลากได้ · ไม่มีการบันทึกข้อมูล','An imaginative toy, not a physics simulation · Use arrow keys on the sliders instead of dragging · Nothing is recorded');$('sceneTitle').textContent=tr('คนหนึ่งคน กับเงาที่มีความคิดของตัวเอง','A person and a shadow with a mind of its own');$('sceneDesc').textContent=tr('ลากดวงอาทิตย์หรือใช้แถบเลื่อนเพื่อค้นพบนิสัยของเงา','Drag the sun or use the sliders to discover the shadow’s personality');renderJournal();status()}
function status(){const text={follow:tr('แสงเป็นของคุณ… แต่เงาล่ะ?','You control the light. But the shadow?'),lag:tr('เดี๋ยวสิ… ขอเวลาตามหน่อย','Wait… let me catch up.'),sleep:tr('เงาขอพักสักงีบ อย่าบอกใครนะ','Your shadow is taking a secret nap.'),wake:tr('ไม่ได้หลับ! แค่พักสายตา','I wasn’t sleeping. Just resting my eyes.'),wave:tr('อ้าว คุณมองเห็นฉันด้วยเหรอ?','Oh. You can see me?'),stretch:tr('วันนี้ขอสูงกว่าคุณหน่อย','Today I get to be taller than you.'),eclipse:tr('ไม่มีแสงคอยสั่ง… ขอเต้นเป็นตัวเอง','No light to boss me around. My time to dance.')};$('status').textContent=text[s.mode]}
function move(x,y){if(!Number.isFinite(x)||!Number.isFinite(y))return;const dist=Math.hypot(x-s.x,y-s.y);if(dist<1)return;if(s.mode==='sleep'){s.awake=2.5;discover('wake')}s.x=Math.max(80,Math.min(920,x));s.y=Math.max(65,Math.min(300,y));s.idle=0;s.moves++;if(dist>35){discover('lag');s.awake=Math.max(s.awake,0)}$('sunX').value=s.x;$('sunY').value=s.y}
function tick(dt){dt=Math.min(.1,Math.max(0,dt));s.idle+=dt;s.wave=Math.max(0,s.wave-dt);s.awake=Math.max(0,s.awake-dt);const eclipse=Math.hypot(s.x-750,s.y-95)<30;const target=(500-s.x)/5;let mode=eclipse?'eclipse':s.wave>0?'wave':s.awake>0?'wake':s.idle>5?'sleep':s.y>255?'stretch':Math.abs(s.angle-target)>12?'lag':'follow';if(mode==='eclipse'||mode==='sleep'||mode==='stretch'||(mode==='lag'&&s.moves>0))discover(mode);if(calm){s.angle=target;s.velocity=0}else{let remaining=dt;while(remaining>0){const d=Math.min(remaining,1/240);s.velocity+=(85*(target-s.angle)-12*s.velocity)*d;s.angle+=s.velocity*d;remaining-=d}s.angle=Math.max(-88,Math.min(88,s.angle))}if(s.mode!==mode){s.mode=mode;status()}draw(dt)}
let clock=0;function draw(dt){clock+=dt;const night=s.mode==='eclipse',sleep=s.mode==='sleep';let angle=sleep?78:night?(calm?0:Math.sin(clock*3)*22):s.angle;let scale=sleep?.65:night?1.05:.68+(s.y-65)/235*.65;let lift=night&&!calm?Math.abs(Math.sin(clock*4))*16:0;$('shadow').setAttribute('transform',`translate(500 ${380-lift}) rotate(${angle}) scale(1 ${scale})`);$('sun').setAttribute('transform',`translate(${s.x} ${s.y})`);$('nightSky').setAttribute('opacity',night?1:0);$('stars').setAttribute('opacity',night?1:0);$('sleepMarks').setAttribute('opacity',sleep?1:0);$('eyes').setAttribute('transform',sleep?'translate(0 -127) scale(1 .1)':'');const waving=s.mode==='wave'||night;const raise=waving?(calm?-165:-145+Math.sin(clock*9)*18):-101;$('shadowArm').setAttribute('d',`M-15-98Q-55-75-69-101M15-98Q55-95 62 ${raise}`);$('smile').setAttribute('d',waving?'M-9-127Q0-114 9-127':'M-7-127Q0-121 7-127')}
$('sunX').oninput=e=>move(+e.target.value,s.y);$('sunY').oninput=e=>move(s.x,+e.target.value);$('wave').onclick=()=>{if(s.mode==='sleep'){discover('wake');s.awake=2.5}s.wave=3;s.idle=0;discover('wave')};$('language').onclick=()=>{lang=lang==='th'?'en':'th';renderText()};$('reset').onclick=init;$('motion').onclick=()=>{calm=!calm;renderText()};media.addEventListener('change',e=>{calm=e.matches;renderText()});$('hint').onclick=()=>$('help').classList.toggle('hidden');
function point(e){const p=$('stage').createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=$('stage').getScreenCTM();if(!m)return;const q=p.matrixTransform(m.inverse());move(q.x,q.y)}
$('stage').addEventListener('pointerdown',e=>{if(e.isPrimary===false||e.button!==0)return;drag=true;$('stage').setPointerCapture(e.pointerId);point(e)});$('stage').addEventListener('pointermove',e=>{if(drag)point(e)});for(const type of ['pointerup','pointercancel','lostpointercapture'])$('stage').addEventListener(type,()=>drag=false);
document.addEventListener('visibilitychange',()=>{prev=performance.now();drag=false});function frame(now){let dt=(now-prev)/1000;prev=now;if(!document.hidden)tick(dt);requestAnimationFrame(frame)}init();requestAnimationFrame(frame);
</script></body></html>
