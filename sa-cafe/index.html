function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bi(x){return Array.isArray(x)?x[lang==='th'?0:1]:x;}
function beep(ok=true){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=ok?660:260;g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.2);}catch(e){sound=false;$('#sound').textContent='♪ OFF';}}
function stopPlay(){playing=false;clearInterval(playTimer);playTimer=null;}

 [['Process และ Data','Process & data'],['อ่านขั้นตอนงาน ความสัมพันธ์ข้อมูล กติกาธุรกิจ และข้อยกเว้นให้เป็น','Understand workflows, data relationships, business rules and exceptions.']],
 [['พื้นฐานระบบและ API','Systems & API basics'],['เข้าใจการเชื่อมต่อระบบ ข้อจำกัด ความปลอดภัย และคุยกับทีมเทคนิคได้ ไม่จำเป็นต้องเขียนทุกส่วนเอง','Understand integrations, constraints and security. Discuss with engineers; you do not need to code every part yourself.']],

 [['ทางเลือกและผลกระทบ','Options & tradeoffs'],['เปรียบเทียบคุณค่า ความเสี่ยง เวลา และข้อจำกัดร่วมกับทีม ไม่รับปากต้นทุนหรือความเป็นไปได้แทนทุกคน','Compare value, risk, time and constraints with the team. Do not promise feasibility or budget on everyone’s behalf.']]
].map(x=>`<details class="skill-card"><summary>${bi(x[0])}</summary><p>${bi(x[1])}</p></details>`).join('')}</div><div class="closing"><div><h3>${t('SA ที่ดี: ไม่เดา ไม่รับปากเกินข้อมูล','Good SA practice: verify before promising')}</h3><p>${t('ใช้หลักฐาน · ตรวจความเข้าใจกับผู้เกี่ยวข้อง · รักษาข้อมูล · บอกข้อไม่แน่นอน · อัปเดตเมื่อเปลี่ยน','Use evidence · Validate with stakeholders · Protect information · State uncertainty · Keep changes traceable')}</p></div></div>`;}

function systemMap(){const labels=[['Order errors','Customer','Cashier','Barista','Owner'],['AS-IS','Paper ticket','Handover','Interpret','Prepare'],['TO-BE','Confirm items','Shared order_id','Track status','Prepare'],['FR-02','No sugar','Shared data','TEST-02','Same request'],['Outcome','User review','Tech review','Test evidence','Measure']][pathStep];const nodes=[[35,25],[335,25],[35,180],[335,180]];return `<div class="system-map"><svg viewBox="0 0 520 275" role="img" aria-label="${bi(rolePath[pathStep][0])}"><defs><linearGradient id="signal"><stop stop-color="#d8f279"/><stop offset="1" stop-color="#6cb9a1"/></linearGradient></defs><g class="signal-lines"><path d="M170 60L220 125 M350 60L300 125 M170 215L220 150 M350 215L300 150"/></g><circle class="map-orbit" cx="260" cy="137" r="73"/><circle class="map-orbit outer" cx="260" cy="137" r="92"/><rect class="map-core" x="185" y="105" width="150" height="66" rx="19"/><text class="core-label" x="260" y="142" text-anchor="middle">${labels[0]}</text>${nodes.map(([x,y],i)=>`<g class="map-node" style="animation-delay:${i*60}ms"><rect x="${x}" y="${y}" width="150" height="70" rx="12"/><text class="node-overline" x="${x+15}" y="${y+22}">${['01','02','03','04'][i]} / ${pathStep===0?'STAKEHOLDER':'SYSTEM VIEW'}</text><text class="node-label" x="${x+15}" y="${y+48}">${labels[i+1]}</text></g>`).join('')}</svg><div class="map-caption">${t('หนึ่งระบบ · หลายมุมมอง · ความเข้าใจร่วมกัน','ONE SYSTEM · MULTIPLE VIEWS · SHARED UNDERSTANDING')}</div></div>`;}

function choosePath(i){pathStep=i;beep();render();}
const roleCases=[
 {tag:'DISCOVER',title:['ลูกค้าบอก “อยากได้แอป”','A stakeholder says: “We need an app.”'],scene:['เจ้าของร้านอยากให้ทำแอปสั่งกาแฟ คุณจะถามอะไรเป็นข้อแรก?','The café owner asks for an ordering app. What should you ask first?'],options:[['อยากได้ปุ่มสีอะไร?','What color should the buttons be?'],['ตอนนี้ใครเจอปัญหาอะไร และรู้ได้อย่างไรว่าแก้สำเร็จ?','Who has which problem today, and how would we know it is solved?'],['ใช้ Framework ไหนดี?','Which framework should we use?']],answer:1,why:['แยก Problem ออกจาก Solution ที่ถูกเสนอ แอปอาจใช่หรืออาจไม่ใช่คำตอบ','Separate the problem from the proposed solution. An app may or may not be the best answer.'],output:['Problem statement + ผู้เกี่ยวข้อง + เป้าหมายที่ตรวจได้','Problem statement + stakeholders + a verifiable goal']},
 {tag:'AS-IS → TO-BE',title:['แต่ละคนเล่าไม่เหมือนกัน','People describe the process differently.'],scene:['Cashier บอกว่ากระดาษชัดแล้ว แต่ Barista บอกว่าอ่านผิดบ่อย คุณควรทำอะไร?','The cashier says paper orders are clear. The barista often misreads them. What should you do?'],options:[['สังเกตงานจริง คุยทั้งสองฝ่าย และวาด AS-IS ให้ตรวจร่วมกัน','Observe the work, hear both roles and validate an AS-IS model together.'],['เลือกเชื่อคนที่ตำแหน่งสูงกว่า','Believe whoever has the higher job title.'],['ออกแบบหน้าจอใหม่ทันที','Redesign the screen immediately.']],answer:0,why:['ตรวจหลักฐานและเข้าใจขั้นตอนจริงก่อนเสนอ TO-BE อย่าสรุปจากเสียงฝ่ายเดียว','Check evidence and understand the real process before proposing TO-BE. Do not rely on only one perspective.'],output:['AS-IS + จุดปัญหา → ทางเลือก TO-BE ที่ตกลงร่วมกัน','AS-IS + pain points → agreed TO-BE options']},
 {tag:'SCOPE & PRIORITY',title:['อยากได้ทุกอย่างพร้อมกัน','Everything sounds important.'],scene:['มีคำขอสะสมแต้ม ส่งเดลิเวอรี และลดออร์เดอร์ผิด แต่เวลาจำกัด คุณควรทำอะไร?','Requests include loyalty points, delivery and fewer incorrect orders, but time is limited. What should you do?'],options:[['รับปากทำทุกอย่างก่อน','Promise to deliver everything.'],['ตัดฟีเจอร์ที่ตัวเองไม่ชอบ','Remove features you personally dislike.'],['เทียบคุณค่าและความเสี่ยงกับเป้าหมาย ให้ผู้ตัดสินใจร่วมจัดลำดับและตกลงขอบเขต','Compare value and risk against the goal; help decision-makers prioritize and agree the scope.']],answer:2,why:['SA ทำให้การตัดสินใจมีข้อมูล และให้คนที่มีอำนาจตัดสินใจตกลงขอบเขต ไม่กำหนดแทนฝ่ายเดียว','An SA informs decisions and gets scope agreed by the appropriate decision-makers, rather than deciding alone.'],output:['In scope / Out of scope + Priority + Assumptions','In scope / Out of scope + Priority + Assumptions']},
 {tag:'EXCEPTIONS',title:['Happy path ผ่านแล้ว','The happy path works.'],scene:['ระบบจ่ายเงินได้ตามปกติ เรื่องไหนต้องถามเพิ่ม?','Normal payment works. Which question still matters?'],options:[['ลูกค้ากดจ่ายซ้ำหรือเน็ตหลุด ระบบควรตอบสนองอย่างไร?','What happens if the customer pays twice or the connection drops?'],['ไม่ต้องถามเพิ่ม เพราะเดโมผ่านแล้ว','Nothing else: the demo passed.'],['ซ่อน Error เพื่อให้ดูเรียบร้อย','Hide errors to make the interface look polished.']],answer:0,why:['ระบบต้องมีกติกาสำหรับข้อยกเว้น ยืนยันกับผู้ใช้และทีมเทคนิคก่อนออกแบบวิธีแก้','Define exception behavior with users and engineers before deciding the implementation.'],output:['Business rule + Error cases + Tests ที่ครอบคลุม','Business rules + error cases + coverage tests']},
 {tag:'ACCEPTANCE',title:['คำว่า “เร็ว” ยังไม่พอ','“Fast” is not enough.'],scene:['บรีฟเขียนว่า “ระบบต้องเร็ว” คุณควรทำอะไรต่อ?','The brief says “the system must be fast.” What comes next?'],options:[['เก็บคำว่าเร็วไว้ เพราะทุกคนเข้าใจ','Keep “fast”; everyone understands it.'],['ตกลงตัวชี้วัด โหลดงาน และสภาพแวดล้อมทดสอบร่วมกับผู้เกี่ยวข้อง','Agree a metric, workload and test conditions with stakeholders.'],['เขียนตัวเลขเองแล้วรับปากทันที','Pick a number yourself and promise it immediately.']],answer:1,why:['Requirement ที่ดีตรวจสอบได้ และค่าที่ใช้ต้องมีที่มาพร้อมตรวจความเป็นไปได้กับทีม','A good requirement is verifiable. Its target needs justification and a feasibility check with the team.'],output:['Requirement ID → Acceptance criteria → Test evidence','Requirement ID → acceptance criteria → test evidence']},
 {tag:'CHANGE & TRACEABILITY',title:['มีคำขอใหม่กลางทาง','A new request arrives mid-project.'],scene:['เจ้าของร้านขอเพิ่มคืนเงินหลังทีมเริ่มพัฒนา คุณควรทำอะไร?','The owner requests refunds after development has begun. What should you do?'],options:[['เพิ่มทันทีโดยไม่บอกใคร','Add it immediately without telling the team.'],['ปฏิเสธทุกการเปลี่ยนแปลง','Reject every change.'],['ทบทวนเหตุผล ตรวจผลกระทบต่อ Process, Data, API, Test และแผนงาน แล้วให้ผู้มีอำนาจตัดสินใจก่อนอัปเดต','Check the reason and impact on process, data, APIs, tests and plans; get the appropriate decision before updating.']],answer:2,why:['SA ช่วยให้การเปลี่ยนแปลงมีเหตุผล เห็นผลกระทบ และทุกฝ่ายใช้ข้อมูลฉบับเดียวกัน','An SA makes change understandable and traceable so everyone works from the same agreed version.'],output:['Change decision + Updated requirements/models/tests','Change decision + updated requirements, models and tests']}
];
function rolePractice(){if(roleQ>=roleCases.length)return `<section class="hero"><div><div class="eyebrow">SA DECISIONS / COMPLETE</div><h1>${t('ถามเป็น<br>เห็นผลกระทบ','Ask well.<br>See the impact.')}</h1><p class="lede">${t('เลือกแนวทางตรงประเด็น','You chose the strongest response in')} ${roleDone.filter(Boolean).length} / ${roleCases.length} ${t('สถานการณ์','scenarios.')}</p><p>${t('งานของ SA คือเชื่อมปัญหา ความต้องการ และการตรวจสอบ ไม่ใช่แค่ส่งเอกสารให้ทีมพัฒนา','SA work connects the problem, requirements and verification. It is more than handing documents to developers.')}</p><div class="hero-actions"><button class="btn primary" onclick="changeView(1)">${t('ดูเครื่องมือที่ช่วยงาน →','Explore the supporting tools →')}</button><button class="btn" onclick="restartRole()">${t('ฝึกใหม่','Practice again')}</button></div></div><div class="counter"><h3>${t('หลักคิดที่นำไปใช้ต่อ','Take these habits with you')}</h3><p>01 · ${t('ถาม Why ก่อนเลือก How','Ask why before choosing how')}</p><p>02 · ${t('คุยกับคนทำงานจริง','Talk to the people doing the work')}</p><p>03 · ${t('ทำให้ความต้องการตรวจสอบได้','Make requirements verifiable')}</p><p>04 · ${t('คิดถึงข้อยกเว้นและผลกระทบ','Consider exceptions and impact')}</p><p>05 · ${t('ทวนความเข้าใจและรักษาข้อมูล','Validate understanding and protect information')}</p></div></section>`;const r=roleCases[roleQ];return `<section><div class="section-title"><div><div class="eyebrow">BE THE ANALYST / ${r.tag}</div><h2>${bi(r.title)}</h2></div><button class="btn" onclick="restartRole()">${t('เริ่มใหม่','Restart')}</button></div><div class="role-lab"><article class="quiz-card"><div class="q-num">CASE ${roleQ+1} / ${roleCases.length}</div><div class="scenario">${bi(r.scene)}</div><div class="answers role-answers">${r.options.map((x,i)=>`<button class="answer ${roleChoice!==null?(i===r.answer?'correct':roleChoice===i?'wrong':''):''}" ${roleChoice!==null?'disabled':''} onclick="answerRole(${i})">${String.fromCharCode(65+i)} · ${bi(x)}</button>`).join('')}</div><div class="feedback ${roleChoice===null?'':roleChoice===r.answer?'success':'fail'}" aria-live="polite">${roleChoice===null?t('คุณจะทำอะไรก่อน? เลือกแล้วดูเหตุผล','What would you do next? Choose a response to reveal the reasoning.'):`<strong>${roleChoice===r.answer?t('คิดแบบ SA! ','That is sound SA practice. '):t('ลองมองให้รอบขึ้น ','Take a wider view. ')}</strong>${bi(r.why)}`}</div><div class="quiz-foot"><span class="hint">${t('คุยเหตุผลร่วมกัน ไม่ต้องรีบตอบ','Discuss the reasoning. There is no rush.')}</span><button class="btn primary" onclick="nextRole()" ${roleChoice===null?'disabled':''}>${roleQ===roleCases.length-1?t('สรุปหลักคิด →','See the takeaways →'):t('เคสถัดไป →','Next case →')}</button></div></article><aside class="role-output"><div class="eyebrow">SA WORKING NOTES</div><h3>${t('สิ่งที่ควรได้จากขั้นนี้','What this step should produce')}</h3><div class="deliverable ${roleChoice===null?'unrevealed':''}">${roleChoice===null?t('เลือกแนวทาง แล้วเปิดผลลัพธ์ที่ควรได้','Choose an approach to reveal the useful output.'):bi(r.output)}</div><p class="hint">${t('นี่คือตัวอย่างกระบวนการคิด ไม่ใช่กฎว่า SA ต้องตัดสินใจทุกอย่างคนเดียว','These are thinking examples, not a rule that the SA makes every decision alone.')}</p><div class="role-path">${roleCases.map((_,i)=>`<span class="path-dot ${i===roleQ?'selected':''} ${i<roleDone.length?'done':''}">${i+1}</span>`).join('')}</div></aside></div></section>`;}
function answerRole(i){if(roleChoice!==null)return;roleChoice=i;const correct=i===roleCases[roleQ].answer;roleDone.push(correct);beep(correct);render();}function nextRole(){if(roleChoice===null)return;roleQ++;roleChoice=null;render();window.scrollTo(0,0);}function restartRole(){roleQ=0;roleChoice=null;roleDone=[];render();}

function explore(){const d=docs[doc],s=d.steps[step];return `<section><div class="section-title"><div><div class="eyebrow">THE SAME SYSTEM, A DIFFERENT LENS</div><h2>${t('เลือกคำถาม แล้วสำรวจ','Choose a question. Explore.')}</h2></div><div class="hint">${t('คลิกหัวข้อซ้าย · ใช้ลูกศรดูทีละขั้น','Choose a model · Use arrows to reveal each step')}</div></div><div class="explore-layout"><aside class="doc-nav" aria-label="SA documents">${docs.map((x,i)=>`<button class="doc-btn ${doc===i?'active':''}" aria-pressed="${doc===i}" onclick="selectDoc(${i})"><span class="doc-num">0${i+1}</span><span class="doc-name">${x.name}<span class="doc-kind">${bi(x.kind)}</span></span></button>`).join('')}</aside><div><article class="studio"><div class="studio-head"><div><h2>${d.name}</h2>${d.name==='SRS'?'<div class="hint">Software Requirements Specification</div>':d.name==='DFD'?'<div class="hint">Data Flow Diagram</div>':d.name==='ER Diagram'?'<div class="hint">Entity–Relationship Diagram</div>':''}<p class="question">${bi(d.ask)}</p></div><span class="pill">${bi(d.kind)}</span></div><div class="diagram">${diagram(doc,step)}</div><div class="lesson-bottom"><div class="lesson-copy" aria-live="polite"><span class="step-number">STEP ${step+1} / 3</span><h3>${s[0]}</h3><p>${s[lang==='th'?1:2]}</p><div class="dots">${d.steps.map((_,i)=>`<button class="dot ${step===i?'active':''}" aria-label="Step ${i+1}" onclick="goStep(${i})"></button>`).join('')}</div></div><div class="step-controls"><button class="btn" onclick="goStep(step-1)" ${step===0?'disabled':''} aria-label="Previous step">←</button><button class="btn primary" onclick="togglePlay()" id="play">${playing?t('หยุด','Pause'):t('เล่น','Play')}</button><button class="btn" onclick="goStep(step+1)" ${step===2?'disabled':''} aria-label="Next step">→</button><button class="btn" onclick="goStep(0)" aria-label="Reset diagram">↺</button></div></div></article><div class="misconception"><strong>${t('อย่าสับสน: ','Keep it clear: ')}</strong>${bi(d.trap)}</div></div></div></section>`;}
function selectDoc(i){stopPlay();doc=i;step=0;beep();render();}function goStep(n){stopPlay();step=Math.max(0,Math.min(2,n));beep();render();}function togglePlay(){if(playing){stopPlay();render();return;}if(step===2)step=0;playing=true;render();playTimer=setInterval(()=>{if(step>=2){stopPlay();render();return;}step++;beep();render();},3600);}
const g=(i,content)=>`<g class="${step===i?'active':''}">${content}</g>`;
const box=(x,y,w,h,title,sub='',rx=12)=>`<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/><text x="${x+w/2}" y="${y+(sub?28:h/2+6)}" text-anchor="middle">${title}</text>${sub?`<text class="small" x="${x+w/2}" y="${y+51}" text-anchor="middle">${sub}</text>`:''}`;
const arrow=(x1,y1,x2,y2,label='',dash=false)=>`<path class="line" d="M${x1} ${y1} L${x2} ${y2}" marker-end="url(#arr)" ${dash?'stroke-dasharray="7 5"':''}/>${label?`<text class="small" x="${(x1+x2)/2}" y="${(y1+y2)/2-10}" text-anchor="middle">${label}</text>`:''}`;
const actor=(x,y,label)=>`<circle class="box" cx="${x}" cy="${y}" r="14"/><path class="line" d="M${x} ${y+14}v40 m-25 -22h50 m-25 22l-23 30 m23 -30l23 30"/><text x="${x}" y="${y+110}" text-anchor="middle">${label}</text>`;

if(n===1)return `<div class="srs-cards"><div class="srs-item ${s===0?'active':''}"><b>FR-01</b> ${t('ระบบต้องคำนวณยอดรวม = ผลรวมของราคา × จำนวนทุกรายการ','The system shall calculate total = sum of price × quantity for all order items.')}</div><div class="srs-item ${s===1?'active':''}"><b>NFR-01</b> ${t('95% ของคำขอดูเมนูตอบภายใน 2 วินาที ที่ผู้ใช้พร้อมกัน 100 คน ในชุดทดสอบ T1','95% of menu requests shall respond within 2 seconds at 100 concurrent users in test setup T1.')}</div><div class="srs-item ${s===2?'active':''}"><b>TEST FR-01</b> 2 × ฿60 = <strong>฿120</strong><br><small>${t('ตัวอย่างข้อกำหนด · T1 ต้องกำหนดรายละเอียดจริงก่อนใช้ทดสอบ','Illustrative requirement · Define the actual T1 environment before testing.')}</small></div></div>`;

return `<svg viewBox="0 0 820 330" role="img" aria-label="${esc(docs[n].name+' '+bi(docs[n].ask))}"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#70988a" stroke-width="1.5"/></marker><marker id="sync" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#70988a"/></marker></defs>${a}</svg>`;}
function quiz(){if(q>=quizzes.length)return quizEnd();const item=quizzes[q];return `<section><div class="section-title"><div><div class="eyebrow">MISSION / CHOOSE THE RIGHT LENS</div><h2>${t('ประชุมทีม SA','The SA team challenge')}</h2></div><button class="btn" onclick="resetQuiz()">${t('เริ่มใหม่','Restart')}</button></div><div class="quiz-layout"><article class="quiz-card"><div class="q-num">BRIEF ${q+1} / ${quizzes.length}</div><div class="scenario">${bi(item.text)}</div><div class="answers">${item.answers.map((x,i)=>`<button class="answer ${chosen!==null?(i===item.a?'correct':chosen===i?'wrong':''):''}" ${chosen!==null?'disabled':''} onclick="answer(${i})"><span style="opacity:.45;margin-right:10px">${String.fromCharCode(65+i)}</span>${esc(bi(x))}</button>`).join('')}</div><div class="feedback ${chosen===null?'':chosen===item.a?'success':'fail'}" aria-live="polite">${chosen===null?t('คุยกันก่อน แล้วให้ครูกดคำตอบของห้อง','Discuss first, then let the teacher select the class answer.'):`<strong>${chosen===item.a?t('ตรงประเด็น! ','That fits! '):t('ลองแยกคำถามอีกครั้ง ','Let’s separate the questions. ')}</strong>${bi(item.why)}`}</div><div class="quiz-foot"><span class="hint">${t('ไม่จับเวลา · อธิบายเหตุผลได้เต็มที่','No timer · Take time to explain your reasoning')}</span><button class="btn primary" onclick="nextQuestion()" ${chosen===null?'disabled':''}>${q===quizzes.length-1?t('ดูผล →','See results →'):t('โจทย์ต่อไป →','Next brief →')}</button></div></article>${scorePanel()}</div></section>`;}
function scorePanel(){return `<aside class="scoreboard"><div class="eyebrow" style="color:var(--lime)">TEAM INSIGHT</div><div class="score">${results.filter(Boolean).length}<span style="font-size:22px;color:#ffffff66"> / ${quizzes.length}</span></div><p>${t('เลือกโมเดลให้ตรงคำถาม แล้วอธิบายให้เพื่อนเห็นภาพ','Choose the model that answers the question, then explain why.')}</p><div class="tokens">${quizzes.map((_,i)=>`<span class="token ${i<results.length?(results[i]?'yes':'no'):''}" aria-label="${i<results.length?(results[i]?'Correct':'Review'):'Not answered'}"></span>`).join('')}</div></aside>`;}
function answer(i){if(chosen!==null)return;chosen=i;const ok=i===quizzes[q].a;results.push(ok);beep(ok);render();}function nextQuestion(){if(chosen===null)return;q++;chosen=null;render();if(q===quizzes.length&&results.filter(Boolean).length>=6)celebrate();}function resetQuiz(){q=0;chosen=null;results=[];render();}function quizEnd(){const n=results.filter(Boolean).length;return `<section class="hero"><div><div class="eyebrow">MISSION COMPLETE</div><h1>${t('คำถามชัด<br>เลือกโมเดลถูก','Clear question.<br>Right model.')}</h1><p class="lede">${t('ห้องของเราตอบถูก','Your class answered')} ${n} / ${quizzes.length} ${t('ข้อ','questions correctly.')}</p><p>${t('ลองให้แต่ละคนเลือกเอกสารหนึ่งแบบ แล้วอธิบายว่าจะใช้ตอบคำถามอะไรในโปรเจกต์ของตัวเอง','Choose one artifact and explain the question it would answer in your own project.')}</p><div class="hero-actions"><button class="btn primary" onclick="resetQuiz()">${t('เล่นใหม่','Play again')}</button><button class="btn" onclick="changeView(3)">${t('เปิดแผนที่สรุป','Open recap')}</button></div></div>${scorePanel()}</section>`;}
function recap(){return `<section class="summary"><div class="role-principle"><strong>${t('หน้าที่หลักของ SA','The core SA responsibility')}</strong><span>${t('เชื่อมความเข้าใจปัญหา ความต้องการ และวิธีตรวจสอบ ระหว่างผู้ใช้ ธุรกิจ และทีมเทคนิค','Connect the problem, requirements and verification across users, business and engineering.')}</span></div><div class="eyebrow">TOOLS SUPPORT THE WORK</div><h2>${t('9 มุมมอง ไม่ใช่ 9 คำตอบเดียวกัน','Nine views. Different questions.')}</h2><p class="lede">${t('คลิกการ์ดเพื่อกลับไปดูตัวอย่าง','Select a card to revisit its example.')}</p><div class="summary-grid">${docs.map((x,i)=>`<button class="mini-card" onclick="view=1;selectDoc(${i})"><strong>${x.name}</strong><span>${bi(x.ask)}</span></button>`).join('')}</div><div class="closing"><div><h3>${t('โจทย์ต่อยอด: ระบบยืมหนังสือ','Transfer challenge: a library system')}</h3><p>${t('ใครเป็น Actor? ต้องเก็บข้อมูลอะไร? ถ้าหนังสือไม่ว่างจะเกิดอะไร? เลือก 2 โมเดลมาอธิบาย','Who are the actors? What data is stored? What if a book is unavailable? Choose two models to explain.')}</p></div><button class="btn lime" onclick="changeView(2)">${t('ทดสอบอีกครั้ง','Try the challenge')}</button></div></section>`;}
function celebrate(){const c=document.createElement('div');c.className='confetti';for(let i=0;i<32;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=['#d8f279','#edc1a6','#176b59'][i%3];p.style.animationDelay=(Math.random()*.4)+'s';c.append(p);}document.body.append(c);setTimeout(()=>c.remove(),2200);}
$('#lang').onclick=()=>{lang=lang==='th'?'en':'th';render();};$('#sound').onclick=()=>{sound=!sound;beep();render();};$('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('#full').title=t('เบราว์เซอร์นี้ไม่รองรับ Fullscreen','Fullscreen unavailable in this browser');}};document.addEventListener('keydown',e=>{if(view!==1||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();goStep(step+1);}if(e.key==='ArrowLeft'){e.preventDefault();goStep(step-1);}});render();
</script></body></html>
