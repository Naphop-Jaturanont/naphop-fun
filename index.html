function render(){document.documentElement.lang=lang;document.getElementById('language').textContent=lang==='th'?'EN':'ไทย';document.getElementById('headline').innerHTML=t('วันนี้ลองอะไรดี?','What will you explore?');document.getElementById('intro-text').textContent=t('เกม บทเรียน และงานทดลอง Interactive เลือกเรื่องที่อยากเปิดได้เลย','Interactive games, lessons and experiments. Choose something to open.');document.getElementById('random').textContent=t('สุ่มให้ฉันลอง →','Surprise me →');document.querySelector('.filters').innerHTML=[['all',t('ทั้งหมด','Everything')],['learn',t('เรียนรู้','Learn')],['play',t('เล่น','Play')]].map(([id,label])=>`<button class="filter ${filter===id?'active':''}" aria-pressed="${filter===id}" onclick="setFilter('${id}')">${label}</button>`).join('');document.getElementById('search').placeholder=t('ค้นหาเรื่องที่อยากลอง','Find something to explore');const found=items.filter(x=>(filter==='all'||x.kind===filter)&&[x.title,x.th,x.en].join(' ').toLowerCase().includes(query));document.getElementById('grid').innerHTML=found.length?found.map(x=>`<a class="tile" href="${x.href}"><div class="art ${x.id==='sa'?'sa-art':'game-art'}"><span class="badge">${x.id==='elevator'?'NEW · AN IMPOSSIBLE JOURNEY':x.id==='shadow'?'A LIVING SHADOW':x.kind==='learn'?'EXPLORE A SYSTEM':'SOLVE THE BRIEF'}</span>${art[x.id]}</div><div class="tile-body"><div class="tile-meta">${x.meta[lang==='th'?0:1]}</div><div class="tile-title"><h2>${x.title}</h2><span class="arrow" aria-hidden="true">→</span></div><p>${lang==='th'?x.th:x.en}</p></div></a>`).join(''):`<div class="empty">${t('ยังไม่มีเรื่องที่ตรงคำค้น ลองคำอื่นหรือเลือกทั้งหมด','No matching experience. Try another term or choose Everything.')}</div>`;document.getElementById('about-title').textContent=t('ไม่ได้มีไว้แค่อ่าน','Not just something to read.');document.getElementById('about-text').textContent=t('ผมชอบเปลี่ยนเรื่องที่เข้าใจยาก ให้เป็นสิ่งที่ทดลองและเห็นผลได้ ที่นี่คือที่รวมงานทดลองเหล่านั้น','I like turning function setFilter(v){filter=v;render()}document.getElementById('language').onclick=()=>{lang=lang==='th'?'en':'th';render()};document.getElementById('search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};document.getElementById('random').onclick=()=>{location.href=items[Math.floor(Math.random()*items.length)].href};render();
