nt-size:13px;transform:rotate(-3deg)}.stamp:nth-child(2){transform:rotate(3deg);background:var(--lime)}footer{border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;font-size:12px;color:#63705d;gap:20px}footer a{text-decoration:none}.live-note{font-size:12px;color:#63705d;line-height:1.6;margin:24px 0 0}.hidden{display:none!important}@media(max-width:800px){.shell{padding:22px}.intro{padding:40px 0 30px;align-items:flex-start}.intro h1{font-size:48px}.intro-side{max-width:300px}.intro p{font-size:16px}.art{height:260px}.tile h2{font-size:23px}.tile-body{padding:20px}.grid{gap:16px}}@media(max-width:600px){.shell{padding:18px}.wordmark{font-size:29px}.tiny{display:none}.intro{display:block;padding-top:40px}.intro h1{font-size:45px}.intro-side{margin-top:22px;max-width:none;gap:17px}.intro p{font-size:17px;max-width:none}.controls{flex-wrap:wrap;padding:20px 0}.search{width:100%;margin:7px 0 0}.filter{padding:9px 14px;font-size:14px}.grid{grid-template-columns:1fr}.art{height:280px}.tile h2{font-size:27px}.about{grid-template-columns:1fr;gap:22px}.manifesto{justify-content:flex-start}.about h3{font-size:23px}footer{flex-direction:column;gap:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.trace{stroke-dashoffset:0}}

let lang='th',filter='all',query='';const t=(a,b)=>lang==='th'?a:b;const items=[{id:'sa',href:'./sa-cafe/',kind:'learn',title:'SA Café Studio',th:'รับบท System Analyst ตั้งคำถามให้ตรงปัญหา แล้วมองระบบผ่านโมเดลที่ใช่',en:'Become the system analyst. Ask better questions and explore a system through the right models.',meta:['บทเรียน Interactive · TH / EN','Interactive lesson · TH / EN']},{id:'detective',href:'./requirements/',kind:'play',title:'Requirement Detective',th:'คำว่า “เร็ว” พอหรือยัง? ตรวจบรีฟ แยกคำคลุมเครือ แล้วหาหลักฐานที่ทดสอบได้',en:'Is “fast” enough? Inspect a brief, spot vague requirements and find testable evidence.',meta:['มินิเกม · TH / EN','Mini-game · TH / EN']}];
const art={sa:`<svg viewBox="0 0 600 330" aria-hidden="true"><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#5b7e62" opacity=".6"/></pattern></defs><rect width="600" height="330" fill="url(#dots)"/><path d="M130 165H470M300 80V250" stroke="#6f8f6c" stroke-width="2"/><path class="trace" d="M130 165H470M300 80V250" stroke="#e1f683" stroke-width="4"/><g transform="rotate(-7 300 165)"><rect x="208" y="60" width="184" height="218" rx="8" fill="#f3f2d8"/><path d="M208 272l12 7 12-7 12 7 12-7 12 7 12-7 12 7 12-7 12 7 12-7 12 7 12-7 12 7 12-7" fill="none" stroke="#f3f2d8" stroke-width="12"/><text x="300" y="94" text-anchor="middle" font-family="monospace" font-size="13" fill="#346044">ORDER #1042</text><path d="M230 111H370" stroke="#78906a" stroke-dasharray="4 4"/><path d="M267 142h52v37q-26 22-52 0zM319 148h11q14 13 0 22h-11" fill="none" stroke="#346044" stroke-width="4"/><text x="300" y="219" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#254832">NO SUGAR</text></g><circle cx="130" cy="165" r="41" fill="#d9ed7a"/><text x="130" y="171" text-anchor="middle" font-family="Arial" font-size="17" fill="#254832">WHY?</text><circle cx="470" cy="165" r="41" fill="#d9ed7a"/><text x="470" y="171" text-anchor="middle" font-family="Arial" font-size="17" fill="#254832">HOW?</text><circle cx="300" cy="40" r="6" fill="#d9ed7a"/><circle cx="300" cy="302" r="6" fill="#d9ed7a"/></svg>`,detective:`<svg viewBox="0 0 500 330" aria-hidden="true"><circle cx="250" cy="165" r="135" fill="#ffb58c"/><g transform="rotate(-8 240 165)"><rect x="102" y="67" width="252" height="199" rx="9" fill="#fff4db"/><rect x="126" y="91" width="98" height="11" rx="4" fill="#d6d5bd"/><text x="126" y="143" font-family="Arial" font-size="27" font-weight="bold" fill="#483c32">Very fast.</text><path d="M126 169h197M126 192h160M126 215h180" stroke="#d6d5bd" stroke-width="9" stroke-linecap="round"/><path d="M125 149h150" str function render(){document.documentElement.lang=lang;document.getElementById('language').textContent=lang==='th'?'EN':'ไทย';document.getElementById('headline').innerHTML=t('โลกเล็ก ๆ<br><em>ให้คุณลองเล่น</em>','Small worlds.<br><em>Big curiosity.</em>');document.getElementById('intro-text').textContent=t('พื้นที่ทดลองไอเดีย เกม และบทเรียนที่กดเล่นได้ เลือกเรื่องที่สนใจ แล้วลองให้รู้เอง','A collection of interactive ideas, games and lessons. Pick something curious. Learn by playing.');document.getElementById('random').textContent=t('สุ่มให้ฉันลอง →','Surprise me →');document.querySelector('.filters').innerHTML=[['all',t('ทั้งหมด','Everything')],['learn',t('เรียนรู้','Learn')],['play',t('เล่น','Play')]].map(([id,label])=>`<button class="filter ${filter===id?'active':''}" aria-pressed="${filter===id}" onclick="setFilter('${id}')">${label}</button>`).join('');document.getElementById('search').placeholder=t('ค้นหาเรื่องที่อยากลอง','Find something to explore');const found=items.filter(x=>(filter==='all'||x.kind===filter)&&[x.title,x.th,x.en].join(' ').toLowerCase().includes(query));document.getElementById('grid').innerHTML=found.length?found.map(x=>`<a class="tile" href="${x.href}"><div class="art ${x.id==='sa'?'sa-art':'game-art'}"><span class="badge">${x.kind==='learn'?'EXPLORE A SYSTEM':'SOLVE THE BRIEF'}</span>${art[x.id]}</div><div class="tile-body"><div class="tile-meta">${x.meta[lang==='th'?0:1]}</div><div class="tile-title"><h2>${x.title}</h2><span class="arrow" aria-hidden="true">→</span></div><p>${lang==='th'?x.th:x.en}</p></div></a>`).join(''):`<div class="empty">${t('ยังไม่มีเรื่องที่ตรงคำค้น ลองคำอื่นหรือเลือกทั้งหมด','No matching experience. Try another term or choose Everything.')}</div>`;document.getElementById('about-title').textContent=t('ไม่ได้มีไว้แค่อ่าน','Not just something to read.');document.getElementById('about-text').textContent=t('ผมชอบเปลี่ยนเรื่องที่เข้าใจยาก ให้เป็นสิ่งที่ทดลองและเห็นผลได้ ที่นี่คือที่รวมงานทดลองเหล่านั้น','I like turning complicated ideas into things you can experiment with. This is where those explorations live.');document.getElementById('stamp-one').textContent=t('กดเล่นได้จริง','ACTUALLY INTERACTIVE');document.getElementById('stamp-two').textContent=t('อยากรู้อะไร ลองเลย','CURIOSITY WELCOME');document.getElementById('footer-note').textContent=t('ไม่มีบัญชีผู้เล่น · ไม่เก็บคะแนนส่วนตัว','No player accounts · No personal score tracking');}
function setFilter(v){filter=v;render()}document.getElementById('language').onclick=()=>{lang=lang==='th'?'en':'th';render()};document.getElementById('search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};document.getElementById('random').onclick=()=>{location.href=items[Math.floor(Math.random()*items.length)].href};render();
</script></body></html>
