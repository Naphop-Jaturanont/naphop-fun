<script>
'use strict';
// MODEL-BEGIN
const REAL_RATE=1, PRESETS=[1,1.25,2,4], KINDS=['still','backward','forward','ambiguous'];
function validRate(v){return typeof v==='number'&&Number.isFinite(v)&&v>=.5&&v<=6&&Math.abs(v*4-Math.round(v*4))<1e-10}
function mod(v,n){const r=((v%n)+n)%n;return Math.abs(r)<1e-12||Math.abs(r-n)<1e-12?0:r}
function model(rate){
 if(!validRate(rate))return null;
 const actual=REAL_RATE/rate, fraction=mod(actual,1), ambiguous=Math.abs(fraction-.5)<1e-10;
 const delta=ambiguous?null:(fraction>.5?fraction-1:fraction), kind=ambiguous?'ambiguous':Math.abs(delta)<1e-10?'still':delta<0?'backward':'forward';
 return {rate,interval:1/rate,actual,delta,kind,apparent:ambiguous?null:delta*rate};
}
function sample(rate,n){if(!validRate(rate)||!Number.isInteger(n)||n<0||n>5)return null;return {time:n/rate,turn:mod(n*REAL_RATE/rate,1)}}
function framePair(rate,n,fraction){
 const m=model(rate);if(!m||!Number.isInteger(n)||n<0||n>4||typeof fraction!=='number'||!Number.isFinite(fraction)||fraction<0||fraction>1)return null;
 const start=sample(rate,n).turn;
 return {real:mod(start+m.actual*fraction,1),alias:m.delta===null?null:mod(start+m.delta*fraction,1),time:(n+fraction)/rate,actual:m.actual*fraction,short:m.delta===null?null:m.delta*fraction};
}
function createState(){return {rate:1.25,prediction:null,revealed:false,frame:0,between:0,discoveries:[]}}
function setRate(s,rate){if(!validRate(rate)||s.rate===rate)return false;s.rate=rate;s.prediction=null;s.revealed=false;s.frame=0;s.between=0;return true}
function predict(s,kind){if(s.revealed||!KINDS.includes(kind))return false;s.prediction=kind;return true}
function capture(s){if(s.revealed||!KINDS.includes(s.prediction))return false;s.revealed=true;s.frame=0;s.between=0;if(PRESETS.includes(s.rate)&&!s.discoveries.includes(s.rate))s.discoveries.push(s.rate);return true}
function selectFrame(s,n){if(!s.revealed||!Number.isInteger(n)||n<0||n>5)return false;s.frame=n;s.between=0;return true}
function setBetween(s,v){if(!s.revealed||s.frame===5||typeof v!=='number'||!Number.isFinite(v)||v<0||v>100||!Number.isInteger(v))return false;s.between=v;return true}
// MODEL-END
let state=createState(),lang='th';
const $=id=>document.getElementById(id),t=(th,en)=>lang==='th'?th:en,num=(v,d=2)=>Number(v.toFixed(d)).toLocaleString(lang==='th'?'th-TH':'en-US',{maximumFractionDigits:d});
function say(text){$('status').textContent=text}
function text(id,th,en){$(id).textContent=t(th,en)}
function direction(kind){return ({still:t('ดูเหมือนหยุด','Looks still'),backward:t('ย้อนทิศ','Backward'),forward:t('ตามทิศจริง','Forward'),ambiguous:t('สองทิศก็ได้','Either direction')})[kind]}
function miniDisc(turn){return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="43" fill="#f0eee2" stroke="#b4c6be"/><g transform="rotate(${turn*360} 50 50)"><line x1="50" y1="50" x2="50" y2="19" stroke="#1f625e" stroke-width="3"/><circle cx="50" cy="19" r="5" fill="#f9a16c" stroke="#203c3b"/></g><circle cx="50" cy="50" r="3" fill="#203c3b"/></svg>`}
function explanation(m){
 const degrees=num(m.actual*360),small=m.delta===null?'':num(Math.abs(m.delta)*360);
 if(m.kind==='still')return t(`ทุกภาพห่างกัน ${num(m.interval)} วินาที จุดหมุนครบ ${num(m.actual)} รอบ จึงกลับมาตำแหน่งเดิม ภาพเหมือนกันไม่ได้พิสูจน์ว่าวัตถุหยุด`, `Each picture is ${num(m.interval)} s apart. The dot completes ${num(m.actual)} full turns and returns to the same place. Identical pictures do not prove it stopped.`);
 if(m.kind==='ambiguous')return t(`จุดจริงเดินไป ${degrees}° ต่อภาพ แต่ตำแหน่งถัดไปอยู่ตรงข้ามพอดี ทางสั้น 180° ไปซ้ายหรือขวาก็ได้ ภาพเหล่านี้จึงแยกสองทิศไม่ได้`, `The real dot travels ${degrees}° per picture, ending exactly opposite. A 180° clockwise or counterclockwise step fits equally well. These pictures cannot distinguish the two directions.`);
 if(m.kind==='backward')return t(`จุดจริงหมุนตามเข็ม ${degrees}° ระหว่างภาพ แต่ทางสั้นที่เชื่อมสองตำแหน่งคือย้อนเข็ม ${small}° ภาพชุดเดียวจึงเข้ากันได้กับการหมุนย้อนทิศที่ช้ากว่า`, `The real dot turns ${degrees}° clockwise between pictures. But the shortest connection goes ${small}° counterclockwise. The same pictures also fit a slower backward rotation.`);
 return t(`จุดจริงเดิน ${degrees}° ต่อภาพ ทางสั้นเดินตามเข็ม ${small}°${m.actual<.5?' และตรงกับการเคลื่อนที่จริงในแบบจำลองนี้':' แต่ยังซ่อนจำนวนรอบที่กล้องพลาดไป'} ภาพเพียงอย่างเดียวไม่บอกว่ามีรอบเต็มซ่อนอยู่กี่รอบ`, `The real dot travels ${degrees}° per picture. The shortest connection goes ${small}° clockwise${m.actual<.5?' and matches the real motion in this model':' but still misses hidden complete turns'}. The pictures alone do not tell us how many full turns were missed.`);
}
function renderFrames(){
 $('frames').innerHTML=Array.from({length:6},(_,n)=>{const a=sample(state.rate,n);return `<button class="frame" type="button" data-frame="${n}" ${state.revealed?'':'disabled'} aria-pressed="${state.revealed&&state.frame===n}" aria-label="${t('ภาพที่','Frame')} ${n+1}, ${state.revealed?num(a.time)+' '+t('วินาที','seconds')+', '+t('ตำแหน่ง','position')+' '+num(a.turn*360)+' '+t('องศาตามเข็มจากด้านบน','degrees clockwise from top'):t('ยังไม่ได้ถ่าย','not captured')}"><span class="no">${t('ภาพ','FRAME')} ${String(n+1).padStart(2,'0')}</span>${miniDisc(state.revealed?a.turn:0)}<span class="time">${state.revealed?num(a.time)+' s':'—'}</span></button>`}).join('');
}
function renderScene(){
 const m=model(state.rate),f=state.revealed?state.frame:0,q=state.revealed?state.between/100:0;
 const pair=f===5?{real:sample(state.rate,5).turn,alias:m.delta===null?null:sample(state.rate,5).turn,time:5/state.rate,actual:0,short:m.delta===null?null:0}:framePair(state.rate,f,q);
 $('realHand').setAttribute('transform',`rotate(${pair.real*360} 150 150)`);
 $('aliasHand').setAttribute('transform',`rotate(${(pair.alias??pair.real)*360} 150 150)`);
 $('aliasHand').style.display=state.revealed&&pair.alias!==null?'':'none';
 $('between').disabled=!state.revealed||f===5;$('between').value=state.between;$('betweenValue').textContent=state.between+'%';

 $('sourceBody').innerHTML=t(`<p><strong>นี่คือ temporal aliasing:</strong> การเคลื่อนที่ต่างแบบกันให้ภาพตัวอย่างชุดเดียวกันได้ จุดของเราหมุนตามเข็มด้วยความเร็วคงที่ 1 รอบ/วินาที ถ่ายภาพในทันทีทุก ๆ 1/fₛ วินาที เริ่มที่ด้านบน ไม่มี motion blur, rolling shutter, สัญญาณรบกวน หรือซี่ล้อซ้ำกัน</p><p>“เรื่องเล่าทางสั้น” เป็นเพียงคำอธิบายหนึ่งที่เลือกการหมุนน้อยกว่าครึ่งรอบระหว่างภาพ ไม่ใช่การทำนายว่าทุกคนจะมองเห็นเหมือนกัน ที่ครึ่งรอบพอดี ทั้งสองทิศเป็นไปได้ จึงไม่วาดเส้นทางแทนคำตอบเดียว</p><div class="formula">มุมจริงต่อภาพ = 360° / fₛ<br>มุมทางสั้น = มุมที่เท่ากันเมื่อคิดวนรอบ ในช่วง −180° ถึง +180°</div><p>เมื่อมากกว่า 2 ภาพต่อวินาที จุด 1 รอบ/วินาทีนี้เคลื่อนน้อยกว่าครึ่งรอบต่อภาพ จึงตีความทางสั้นได้ตรง แต่ยังต้องมีข้อมูลเรื่องความเร็วสูงสุดจึงตัดการหมุนเร็วแบบอื่นทิ้งได้ หลัก Nyquist–Shannon พูดถึงความถี่สูงสุดของสัญญาณ ไม่ใช่สูตรเลือก FPS สำหรับทุกวิดีโอ และอัตราเท่ากับ 2 พอดียังแยกทิศไม่ได้ในตัวอย่างนี้</p><p>สัญลักษณ์ CW = ตามเข็มนาฬิกา, CCW = ทวนเข็มนาฬิกา ตัวเลขปัดเศษแต่คำนวณด้วยค่าที่ยังไม่ปัดเศษ การเลื่อนเป็นการตรวจเวลาในแบบจำลอง ไม่ใช่ความเร็วเล่นวิดีโอจริง</p><p>อ่านแหล่งอ้างอิงต่อไปนี้เพื่อตรวจแนวคิด ไม่ได้คัดลอกภาพหรือโค้ด:</p>`, `<p><strong>This is temporal aliasing:</strong> different motions can produce the same samples. Our single marked dot turns clockwise at a constant 1 turn/second. Instantaneous snapshots occur every 1/fₛ seconds, starting at the top. We omit motion blur, rolling shutter, noise, and repeated identical spokes.</p><p>The “shortest-route story” is one interpretation, choosing less than half a turn between pictures. It does not predict what every viewer perceives. At exactly half a turn, both directions fit, so we do not draw one as the answer.</p><div class="formula">actual angle per picture = 360° / fₛ<br>shortest angle = an equivalent wrapped angle between −180° and +180°</div><p>Above 2 pictures per second, this 1-turn/second dot moves less than half a turn per picture, so the shortest route matches it. A known speed bound is still needed to rule out faster rotations. Nyquist–Shannon concerns a signal's highest frequency; this is not a universal video-FPS rule. Exactly 2 pictures per second cannot resolve direction in this example.</p><p>CW = clockwise; CCW = counterclockwise. Displayed values are rounded; calculations use unrounded values. Scrubbing inspects model time, not real video playback speed.</p><p>These sources inform the explanation. Their code and artwork are not reused:</p>`);
