<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Bureau · Naphop.fun</title><style>
:root{--ink:#252e42;--paper:#fff8e8;--blue:#304d85;--red:#b6374e;--gold:#f1be60}*{box-sizing:border-box}body{margin:0;background:#e5e9eb;color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.65}button,a,input{font:inherit}button{cursor:pointer;border:1px solid #283e63;padding:12px 19px;border-radius:8px;background:var(--paper);color:var(--ink);font-weight:bold}button:disabled{opacity:.45;cursor:default}button:hover:not(:disabled){background:#f8d692}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c13860;outline-offset:4px}header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;padding:20px;align-items:center}a{color:inherit}main{max-width:1140px;margin:auto;padding:15px 22px 60px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:center;margin:22px 0 32px}.eyebrow{font:12px monospace;letter-spacing:2px;text-transform:uppercase}h1{font-family:Georgia,Tahoma,serif;font-size:clamp(40px,6vw,76px);line-height:1.1;margin:14px 0}h1 span{color:var(--red)}.lead{font-size:19px;max-width:650px}.prediction{background:var(--blue);color:white;padding:26px;border-radius:14px;box-shadow:8px 8px 0 #bcc8d8}.prediction label{display:block;font-weight:bold;font-size:18px}.prediction input{width:100%;accent-color:var(--gold)}.bigguess{font:50px Georgia;display:block}.desk{background:#52647c;border-radius:18px;padding:20px;box-shadow:0 12px 0 #364357}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;color:white}.controls{display:flex;flex-wrap:wrap;gap:10px}.primary{background:var(--gold)}.display{display:grid;grid-template-columns:1fr 290px;gap:20px}.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:7px;align-content:start;background:#293b54;padding:18px;border-radius:12px;min-height:315px}.person{aspect-ratio:.85;min-width:0;background:#f9efdc;border-radius:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 3px 0 #18283c;font-size:11px;animation:arrive .2s ease-out}.person .face{font-size:26px;line-height:1.2;color:var(--blue)}.person.match{background:#ffd69a;border:2px solid var(--red)}.person.match .face{color:var(--red)}.empty{grid-column:1/-1;color:#d0d9e7;text-align:center;padding:55px 15px}.receipt{background:var(--paper);padding:23px;border-radius:3px;position:relative}.receipt h2{font-family:Georgia,Tahoma,serif;margin:0;font-size:25px}.receipt .rule{border-top:2px dashed #c5c0ad;margin:17px 0}.count{font:62px Georgia;line-height:1.2}.stats{display:flex;justify-content:space-between;gap:10px}.stats strong{font-size:25px}.status{font-weight:bold;min-height:80px;border:2px solid var(--red);color:var(--red);padding:12px;transform:rotate(-2deg);margin:22px 0}.hint{font-size:13px;line-height:1.6}.reveal{margin-top:28px;border-radius:14px;background:var(--paper);padding:30px}.reveal h2{font:32px Georgia,Tahoma,serif;margin:0 0 10px}.comparisons{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}.comparison{padding:20px;border:1px solid #c6c7be;border-radius:10px}.comparison strong{font:44px Georgia;display:block}.bar{height:9px;background:#e0e3da;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}.experiments{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.small{font-size:14px}.tally{margin:22px 0;padding:18px;background:#e5e9eb;border-radius:10px}.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:12px}.dot{aspect-ratio:1;border-radius:50%;background:#aab8c4}.dot.yes{background:var(--red)}details{margin-top:22px;background:#f4f3ec;border-radius:10px;padding:18px}summary{cursor:pointer;font-weight:bold}.footer{margin-top:25px;font-size:13px;color:#5d6571}.hidden{display:none}@keyframes arrive{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:760px){.hero,.display,.comparisons{grid-template-columns:1fr}.wall{grid-template-columns:repeat(auto-fit,minmax(46px,1fr));min-height:160px}.hero{gap:18px}.person .face{font-size:23px}.receipt{padding:20px}.count{font-size:48px}.desk{padding:12px}main{padding:8px 14px 40px}.reveal{padding:20px}.dots{grid-template-columns:repeat(10,1fr)}}
</style><header><a href="../">← naphop.fun</a><button id="lang">EN</button></header><main>
<div class="hero"><section><div class="eyebrow">Department of unlikely coincidences / No. 012</div><h1 id="title"></h1><p class="lead" id="intro"></p><p class="small" id="privacy"></p></section><section class="prediction"><label for="guess" id="guess-label"></label><output class="bigguess" id="guess-num">50%</output><input id="guess" type="range" min="0" max="100" value="50" step="1"><p class="small" id="guess-note"></p><button id="lock"></button></section></div>
<section class="desk"><div class="toolbar"><strong id="room-label"></strong><div class="controls"><button id="add" class="primary"></button><button id="fill"></button><button id="reset"></button></div></div><div class="display"><div id="wall" class="wall" aria-label="Simulated visitors"></div><aside class="receipt"><h2 id="receipt-title"></h2><div class="rule"></div><div class="count" id="count">0</div><span id="people-label"></span><div class="rule"></div><div class="stats"><div><strong id="pairs">0</strong><div id="pairs-label"></div></div><div><strong id="matches">0</strong><div id="matches-label"></div></div></div><div id="status" class="status" role="status" aria-live="polite"></div><p class="hint" id="sample-note"></p></aside></div></section>
<section class="reveal hidden" id="reveal"><h2 id="reveal-title"></h2><p id="guess-result" role="status" aria-live="polite"></p><div class="comparisons"><div class="comparison"><span id="any-label"></span><strong id="chance"></strong><div class="bar"><i id="chance-bar"></i></div></div><div class="comparison"><span id="you-label"></span><strong id="you-chance"></strong><div class="bar"><i id="you-bar"></i></div></div></div><p id="explain"></p><div class="experiments"><button data-size="10">10</button><button data-size="23">23</button><button data-size="40">40</button><button data-size="70">70</button></div><p class="small" id="size-note"></p><button id="batch"></button><div id="tally" class="tally hidden"><p id="tally-text" role="status" aria-live="polite"></p><div id="dots" class="dots" aria-hidden="true"></div></div></section>
<details><summary id="model-title"></summary><p id="model"></p><p id="formula"></p><p><a href="https://mathworld.wolfram.com/BirthdayProblem.html" target="_blank" rel="noopener">Wolfram MathWorld · Birthday Problem</a></p><p class="small" id="sources-note"></p></details><p class="footer" id="footer"></p></main><script>
'use strict';
function probability(n){let q=1;for(let i=0;i<n;i++)q*=Math.max(0,(365-i)/365);return 1-q}
function fixedProbability(n){return 1-Math.pow(364/365,Math.max(0,n-1))}
function pairCount(n){return n*(n-1)/2}
function matchingPairs(days){let seen={};let pairs=0;for(const d of days){pairs+=seen[d]||0;seen[d]=(seen[d]||0)+1}return pairs}
function drawDay(){const a=new Uint32Array(1);let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=4294967045);return x%365}
let lang='th',days=[],locked=false,guess=50,target=23,results=[];
const $=id=>document.getElementById(id),t=(th,en)=>lang==='th'?th:en,fmt=x=>(100*x).toFixed(2)+'%';
const months={th:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
function dateLabel(day){const d=new Date(Date.UTC(2025,0,1+day));return d.getUTCDate()+' '+months[lang][d.getUTCMonth()]}
function add(n){if(!locked)return;while(n-->0&&days.length<target)days.push(drawDay());render()}
function newRoom(size=target){target=size;days=[];results=[];render()}
function render(){document.documentElement.lang=lang;$('lang').textContent=lang==='th'?'EN':'ไทย';$('title').innerHTML=t('ห้องนี้มี<br><span>วันเกิดซ้ำไหม?</span>','A room full of<br><span>coincidences.</span>');$('intro').textContent=t('คน 23 คน วันเกิดที่เป็นไปได้ 365 วัน คุณคิดว่าจะมีใครเกิดวันเดียวกันไหม?','23 people. 365 possible birthdays. Would you expect any two people to share a birthday?');$('privacy').textContent=t('คนและวันเกิดทั้งหมดเป็นข้อมูลสุ่ม ไม่มีการขอวันเกิดจริง','All visitors and birthdays are simulated. No real birthday is requested.');$('guess-label').textContent=t('ทายก่อน: โอกาสที่อย่างน้อย 2 ใน 23 คนเกิดวันเดียวกัน?','Predict: the chance of at least two of 23 sharing a birthday?');$('guess-note').textContent=t('เลื่อนเปอร์เซ็นต์ แล้วเปิดประตูรับคนเข้าห้อง','Choose a percentage, then open the doors.');$('guess-num').textContent=guess+'%';$('guess').disabled=locked;$('lock').disabled=locked;$('lock').textContent=locked?t('บันทึกคำทายแล้ว','Prediction locked'):t('ล็อกคำทาย · เปิดห้อง →','Lock prediction · Open doors →');$('room-label').textContent=t('สำนักงานวันเกิด · รับได้ '+target+' คน','BIRTHDAY BUREAU · Capacity '+target);$('add').textContent=t('รับเพิ่ม 1 คน','Admit one');$('fill').textContent=t('รับจนครบ '+target+' คน','Fill to '+target);$('reset').textContent=t('เริ่มใหม่ทั้งหมด','Start over');$('add').disabled=$('fill').disabled=!locked||days.length>=target;$('receipt-title').textContent=t('ใบบันทึกห้อง','Room receipt');$('count').textContent=days.length;$('people-label').textContent=t('คนในห้อง','visitors in this room');$('pairs').textContent=pairCount(days.length);$('pairs-label').textContent=t('คู่ที่เปรียบเทียบได้','possible pairs');const m=matchingPairs(days);$('matches').textContent=m;$('matches-label').textContent=t('คู่ที่วันเกิดตรงกัน','matching pairs');$('status').textContent=!locked?t('ล็อกคำทายก่อนเริ่ม','Lock your prediction first'):m?t('พบวันเกิดตรงกัน!','MATCH FOUND!'):days.length===target?t('รอบนี้ไม่มีวันซ้ำ','NO MATCH THIS ROUND'):t('ยังไม่พบวันซ้ำ','No match yet');$('sample-note').textContent=t('นี่คือผลสุ่มเพียงห้องเดียว ไม่ใช่หลักฐานว่าโอกาสเป็น 0% หรือ 100%','One random room is not proof that the probability is 0% or 100%.');const counts={};days.forEach(d=>counts[d]=(counts[d]||0)+1);$('wall').setAttribute('aria-label',t('คนสมมติในห้อง','Simulated visitors'));$('wall').innerHTML=days.length?days.map((d,i)=>`<div class="person ${counts[d]>1?'match':''}" title="${t('คนที่','Visitor')} ${i+1}: ${dateLabel(d)}"><span class="face" aria-hidden="true">${counts[d]>1?'●':'◕'}</span><b>#${String(i+1).padStart(2,'0')}</b><span>${dateLabel(d)}</span></div>`).join(''):`<div class="empty">${t('เก้าอี้ว่าง วันเกิดยังเป็นปริศนา<br>กดรับคน แล้วดูว่าใครมีวันเกิดตรงกัน','Empty seats. Unknown birthdays.<br>Admit visitors and watch for matching dates.')}</div>`;
const full=days.length===target;$('reveal').classList.toggle('hidden',!full);$('reveal-title').textContent=t('ความบังเอิญไม่ได้หายากเท่าที่คิด','Coincidence has more chances than you think.');$('guess-result').textContent=t('คุณทายสำหรับ 23 คนไว้ '+guess+'% · แบบจำลองให้ 50.73%','Your prediction for 23 people: '+guess+'% · Model: 50.73%');$('any-label').textContent=t('อย่างน้อยหนึ่งคู่ใน '+target+' คน','At least one pair among '+target);$('you-label').textContent=t('ใครสักคนตรงกับคนแรก (จาก '+target+' คน)','Someone matches the first visitor (of '+target+')');$('chance').textContent=fmt(probability(target));$('you-chance').textContent=fmt(fixedProbability(target));$('chance-bar').style.width=fmt(probability(target));$('you-bar').style.width=fmt(fixedProbability(target));$('explain').textContent=t('ห้องนี้เปรียบเทียบได้ '+pairCount(target)+' คู่ ไม่ใช่แค่ '+(target-1)+' คู่กับคนแรก เมื่อเพิ่มคนหนึ่งคน เขาเพิ่มโอกาสจับคู่กับทุกคนที่อยู่ก่อนแล้ว แต่เหตุการณ์เกิดวันซ้ำของแต่ละคู่ทับซ้อนกันได้ จึงใช้สูตรนับกรณี “ไม่ซ้ำเลย” แทนการบวกเปอร์เซ็นต์','This room has '+pairCount(target)+' possible pairs, not just '+(target-1)+' pairs with the first visitor. Each new visitor adds a comparison with everyone already here. Pair-match events can overlap, so their probabilities cannot simply be added. Calculate the chance of no matches, then subtract from 1.');$('size-note').textContent=t('เลือกขนาดห้องใหม่ แล้วกดรับคนอีกครั้ง ทุกห้องสุ่มใหม่','Choose a new room size, then admit visitors again. Every room is freshly sampled.');document.querySelectorAll('[data-size]').forEach(b=>{b.textContent=b.dataset.size+t(' คน',' people');b.setAttribute('aria-pressed',String(+b.dataset.size===target))});$('batch').textContent=t('ทดลอง 100 ห้องขนาดนี้','Sample 100 rooms of this size');$('tally').classList.toggle('hidden',!results.length);$('tally-text').textContent=results.length?t('พบวันซ้ำ '+results.filter(Boolean).length+' จาก 100 ห้อง · จุดแดง = มีคู่ซ้ำ · ผลสุ่มเปลี่ยนได้ ไม่จำเป็นต้องเท่าค่าทฤษฎี','Matches in '+results.filter(Boolean).length+' of 100 rooms · red = a match · Random results vary; they need not equal the theoretical rate.'):'';$('dots').innerHTML=results.map(v=>`<i class="dot ${v?'yes':''}"></i>`).join('');$('model-title').textContent=t('แบบจำลองนี้สมมติอะไร?','What does this model assume?');$('model').textContent=t('365 วันมีโอกาสเท่ากัน แต่ละคนสุ่มอย่างอิสระ ไม่นับ 29 ก.พ. และเทียบเฉพาะวันกับเดือน ไม่ใช่ปีเกิด วันเกิดจริงไม่กระจายสม่ำเสมอเสมอไป จึงไม่ใช่คำพยากรณ์ของห้องเรียนหรือประเทศใด','365 equally likely days; independent draws; no February 29; compare month and day, not birth year. Real birthdays are not always uniform, so this is not a prediction for a particular classroom or country.');$('formula').textContent=t('โอกาสซ้ำ = 1 − (365/365 × 364/365 × … × (365−n+1)/365) สำหรับ n ≤ 365; จำนวนคู่ = n(n−1)/2','Match probability = 1 − (365/365 × 364/365 × … × (365−n+1)/365), for n ≤ 365; pair count = n(n−1)/2.');$('sources-note').textContent=t('อ่านและตรวจสูตร 13 พ.ย. 2026 · ตัวเลขบนหน้าเว็บคำนวณจากสูตร ไม่ใช่สถิติประชากร','Source checked 13 Nov 2026 · Values are calculated from the formula, not population statistics.');$('footer').textContent=t('Naphop.fun · งานทดลองต้นฉบับ ไม่มีแบบฟอร์มข้อมูลส่วนตัว ไม่มีการบันทึกคะแนน','Naphop.fun · An original experiment. No personal-data forms or saved scores.');}
$('guess').oninput=e=>{guess=+e.target.value;$('guess-num').textContent=guess+'%'};$('lock').onclick=()=>{locked=true;render();$('add').focus()};$('add').onclick=()=>add(1);$('fill').onclick=()=>add(target);$('reset').onclick=()=>{locked=false;guess=50;target=23;days=[];results=[];$('guess').value=50;render();$('lock').focus()};$('lang').onclick=()=>{lang=lang==='th'?'en':'th';render()};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{newRoom(+b.dataset.size);$('add').focus()});$('batch').onclick=()=>{results=Array.from({length:100},()=>matchingPairs(Array.from({length:target},drawDay))>0);render()};render();
</script></html>
